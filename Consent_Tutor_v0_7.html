елем, не опасаясь ответного наказания.","somaticRu":"Оба всё ещё раздражены, но напряжение постепенно спадает."},"s3":{"stageEn":"Negotiating","titleEn":"A workable agreement","bodyEn":"Alex listens: “You were looking forward to seeing them. Dinner still needs help.” Jamie suggests doing the chopping and setting the table now, then going to the skate park for two hours and returning at the agreed time. Alex asks about transport and safety. They do not have identical opinions, but both can contribute.","somaticEn":"The tension eases as the problem becomes specific.","choices":[{"id":"agree","labelEn":"They agree on the plan and clarify what happens if the timing changes.","subEn":"","nextSceneId":"e_repair","dynamicType":"curious_check_in","deltas":{"closeness":4,"intimacy":3,"coercion":-2,"ownership":-2,"karma":4},"labelRu":"Они принимают план и уточняют, что делать, если время возвращения изменится."},{"id":"counter","labelEn":"Alex proposes a different split; Jamie asks to compare the two plans.","subEn":"","nextSceneId":"e_repair","dynamicType":"curious_check_in","deltas":{"closeness":3,"intimacy":2,"coercion":-1,"karma":3},"labelRu":"Алекс предлагает другое распределение дел, а Джейми просит сравнить оба варианта."}],"stageRu":"Поиск договорённости","titleRu":"Решение, которое подходит обоим","bodyRu":"Алекс выслушивает Джейми: «Ты очень хотел(а) увидеться с друзьями. Но с ужином тоже нужна помощь». Джейми предлагает сейчас нарезать продукты и накрыть на стол, затем сходить в скейт-парк на два часа и вернуться к оговорённому времени. Алекс уточняет, как Джейми доберётся туда и насколько это безопасно. У них разные мнения, но оба участвуют в поиске решения.","somaticRu":"Напряжение ослабевает, когда проблема становится конкретной."}},"endings":{"e_repair":{"tone":"safe","badgeEn":"Healthy conflict & repair","titleEn":"Disagreement without fear","bodyEn":"They did not avoid conflict. They handled it without intimidation, coercion or humiliation, and they repaired the sharp moment. A healthy family is not a family that never argues; it is one where people can disagree and remain safe, heard and respected.","titleRu":"Разногласие без страха","bodyRu":"Они не избегали конфликта, а справились с ним без запугивания, давления и унижения и исправили последствия резкого разговора. Здоровая семья — не та, где никогда не спорят, а та, где люди могут не соглашаться и при этом оставаться в безопасности, быть услышанными и уважаемыми.","badgeRu":"Здоровый конфликт и восстановление контакта"}}},"B":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"A Saturday disagreement","titleEn":"The parent’s perspective","bodyEn":"You are Alex. Jamie wants to meet friends while you need help preparing dinner. You feel overloaded and answer sharply: “I already asked you twice.” Jamie says you always decide everything. You can be frustrated and still remain responsible for how you respond.","somaticEn":"Your jaw tightens; you notice the urge to insist because you feel ignored.","choices":[{"id":"listen","labelEn":"Ask Jamie what matters about the plan before deciding.","subEn":"","nextSceneId":"s3","dynamicType":"curious_check_in","deltas":{"closeness":3,"intimacy":2,"karma":3},"labelRu":"Спросить Джейми, почему этот план для него/неё важен, прежде чем принимать решение."},{"id":"pause","labelEn":"Name your irritation and take a short pause, promising to return to the discussion.","subEn":"","nextSceneId":"s2","dynamicType":"clean_boundary","deltas":{"coercion":-1,"karma":2},"labelRu":"Назвать своё раздражение и ненадолго прерваться, пообещав вернуться к разговору."},{"id":"command","labelEn":"Demand obedience and say the discussion is over.","subEn":"","nextSceneId":"s2","dynamicType":"intimidation","deltas":{"closeness":-3,"intimacy":-2,"coercion":4,"ownership":3,"karma":-3},"labelRu":"Потребовать подчинения и заявить, что обсуждение закончено."}],"stageRu":"Субботний спор","titleRu":"Взгляд родителя","bodyRu":"Вы — Алекс. Джейми хочет встретиться с друзьями, а вам нужна помощь с приготовлением ужина. Вы перегружены делами и резко отвечаете: «Я уже дважды просил(а) тебя». Джейми говорит, что вы всегда всё решаете за него/неё. Вы можете раздражаться, но всё равно отвечаете за то, как ведёте себя.","somaticRu":"Напрягается челюсть; вы замечаете желание настоять на своём, потому что чувствуете, что вас не слышат."},"s2":{"stageEn":"A sharp moment","titleEn":"Repair is still possible","bodyEn":"You are still annoyed. You can insist that your child agree with you, or you can acknowledge your tone and return to the practical issue. A proportionate household expectation is not the same as humiliating or frightening a child.","somaticEn":"Notice whether you are trying to solve the problem or win the argument.","choices":[{"id":"repair","labelEn":"Apologise for snapping without withdrawing the reasonable request for help.","subEn":"","nextSceneId":"s3","dynamicType":"honest_repair","deltas":{"closeness":3,"intimacy":2,"coercion":-1,"karma":3},"labelRu":"Извиниться за резкий тон, не отказываясь от разумной просьбы помочь."},{"id":"double","labelEn":"Call Jamie selfish and threaten to cancel all social plans indefinitely.","subEn":"","nextSceneId":"e_harm","dynamicType":"intimidation","deltas":{"closeness":-5,"intimacy":-4,"coercion":7,"ownership":5,"karma":-6},"labelRu":"Назвать Джейми эгоистом и пригрозить отменить все встречи с друзьями на неопределённый срок."}],"stageRu":"Резкий момент","titleRu":"Исправить ситуацию ещё можно","bodyRu":"Вы всё ещё раздражены. Можно требовать, чтобы ребёнок согласился с вами, а можно признать резкий тон и вернуться к практическому вопросу. Разумная просьба помочь по дому — не то же самое, что унижение или запугивание ребёнка.","somaticRu":"Заметьте, вы пытаетесь решить проблему или выиграть спор."},"s3":{"stageEn":"Negotiating","titleEn":"Set a clear, proportionate expectation","bodyEn":"You explain what help is needed and listen to Jamie’s proposal. A fair agreement can include chores, a time to return and a way to contact each other. If you set a consequence, it should be related, proportionate, explained and time-limited—not a tool for fear or isolation.","somaticEn":"You can hold a boundary without making the child feel powerless.","choices":[{"id":"agree","labelEn":"Agree a practical plan and invite Jamie to tell you if something changes.","subEn":"","nextSceneId":"e_repair","dynamicType":"curious_check_in","deltas":{"closeness":4,"intimacy":3,"coercion":-2,"karma":4},"labelRu":"Договориться о практичном плане и предложить Джейми сообщить, если что-то изменится."},{"id":"control","labelEn":"Use the disagreement to demand access to every private message and friendship.","subEn":"","nextSceneId":"e_harm","dynamicType":"surveillance","deltas":{"closeness":-4,"intimacy":-4,"coercion":6,"ownership":6,"karma":-5},"labelRu":"Использовать спор как повод потребовать доступ ко всем личным сообщениям и дружеским контактам."}],"stageRu":"Поиск договорённости","titleRu":"Чёткие и соразмерные ожидания","bodyRu":"Вы объясняете, какая помощь нужна, и выслушиваете предложение Джейми. Справедливая договорённость может включать домашние обязанности, время возвращения и способ связаться друг с другом. Если вы устанавливаете последствие, оно должно быть связано с ситуацией, соразмерно, понятно и ограничено по времени — а не использоваться для запугивания или изоляции.","somaticRu":"Вы можете обозначить границу, не лишая ребёнка права голоса."}},"endings":{"e_repair":{"tone":"safe","badgeEn":"Healthy conflict & repair","titleEn":"Authority with respect","bodyEn":"You remained the parent and kept reasonable expectations, while allowing your child a voice. Respect does not mean permissiveness; it means limits are not enforced through fear, humiliation or control.","titleRu":"Авторитет с уважением","bodyRu":"Вы сохранили родительскую роль и разумные ожидания, одновременно позволив ребёнку высказать своё мнение. Уважение не означает вседозволенность: ограничения не должны обеспечиваться страхом, унижением или контролем.","badgeRu":"Здоровый конфликт и восстановление контакта"},"e_harm":{"tone":"coercive","badgeEn":"Safety concern","titleEn":"Control replaces guidance","bodyEn":"Threats, humiliation, indefinite punishment or intrusive surveillance can make a child afraid rather than help them learn. Pause, repair the harm and seek appropriate parenting support if this pattern repeats.","titleRu":"Контроль вместо воспитания","bodyRu":"Угрозы, унижение, бессрочные наказания и навязчивое наблюдение могут не научить ребёнка, а напугать его. Остановитесь, исправьте причинённый вред и обратитесь за поддержкой по вопросам воспитания, если такая модель повторяется.","badgeRu":"Риск для безопасности"}}}}},{"id":"childhood_beyond_conflict","categoryTag":"Youth / Everyday Life","en":{"shortTitle":"A Child’s Own Life","title":"A Child’s Own Life","subtitle":"School, friendships, activities, voice and trusted support","roleNames":{"A":"Jamie","B":"Caregiver"}},"ru":{"shortTitle":"Собственная жизнь ребёнка","title":"Собственная жизнь ребёнка","subtitle":"У ребёнка есть своя жизнь за пределами семейных трудностей","roleNames":{"A":"Джейми","B":"Взрослый"}},"roleTrees":{"A":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"A week of ordinary life","titleEn":"More than the family situation","bodyEn":"You are 13. You have a science project, a friend’s birthday, football practice and a group chat that keeps buzzing. At home, your parents have been tense lately, but your life is not only about their relationship. You can choose what deserves your attention today.","somaticEn":"You feel pulled between excitement, homework and the atmosphere at home.","choices":[{"id":"study","labelEn":"Work on the science project with a classmate after school.","subEn":"","nextSceneId":"s2","dynamicType":"child_self_advocacy","deltas":{"closeness":1,"intimacy":1,"karma":2},"labelRu":"После школы поработать над проектом по естественным наукам вместе с одноклассником."},{"id":"friends","labelEn":"Go to football practice and spend time with friends.","subEn":"","nextSceneId":"s2","dynamicType":"child_self_advocacy","deltas":{"closeness":1,"karma":2},"labelRu":"Пойти на футбольную тренировку и провести время с друзьями."},{"id":"checkin","labelEn":"Tell a trusted adult that things at home have felt stressful and ask to talk privately.","subEn":"","nextSceneId":"s3","dynamicType":"clean_boundary","deltas":{"coercion":-1,"karma":3},"labelRu":"Рассказать надёжному взрослому, что дома в последнее время напряжённо, и попросить поговорить наедине."}],"stageRu":"Обычная неделя","titleRu":"Жизнь не сводится к проблемам в семье","bodyRu":"Тебе 13 лет. У тебя проект по естественным наукам, день рождения друга, тренировка по футболу и оживлённый групповой чат. В последнее время дома родители напряжены, но твоя жизнь не сводится к их отношениям. Ты можешь сам(а) решить, чему уделить внимание сегодня.","somaticRu":"Тебя одновременно увлекают планы, домашнее задание и напряжённая атмосфера дома."},"s2":{"stageEn":"A child’s own world","titleEn":"Plans, friends and boundaries","bodyEn":"A parent messages that you should come straight home. You had agreed to be home at six, and it is only four. You can reply with a clear update. You do not have to abandon every friendship or activity because adults are having difficulties.","somaticEn":"You may feel guilty for enjoying yourself when home feels tense.","choices":[{"id":"update","labelEn":"Send a clear message about where you are and when you will be home.","subEn":"","nextSceneId":"s3","dynamicType":"honest_repair","deltas":{"closeness":2,"intimacy":1,"karma":2},"labelRu":"Написать, где ты находишься и во сколько вернёшься."},{"id":"askhelp","labelEn":"Ask the coach or another trusted adult to help clarify the plan if you feel unsafe going home.","subEn":"","nextSceneId":"s3","dynamicType":"clean_boundary","deltas":{"coercion":-2,"karma":3},"labelRu":"Если тебе небезопасно возвращаться домой, попросить тренера или другого надёжного взрослого помочь прояснить план."}],"stageRu":"Свой мир","titleRu":"Планы, друзья и личные границы","bodyRu":"Родитель пишет, что ты должен(на) сразу идти домой. Вы договаривались, что ты вернёшься к шести, а сейчас только четыре. Можно просто сообщить, где ты находишься и когда вернёшься. Тебе не нужно отказываться от всех друзей и занятий из-за трудностей взрослых.","somaticRu":"Может появиться чувство вины за то, что ты веселишься, пока дома напряжённо."},"s3":{"stageEn":"A trusted conversation","titleEn":"You are allowed to ask for support","bodyEn":"A trusted adult listens without making you responsible for the adults’ relationship. You can share as much or as little as you want. They explain that if they are worried about your safety, they may need to involve people whose job is to help keep children safe; they should explain that process as clearly as they can.","somaticEn":"You do not need to solve everything in one conversation.","choices":[{"id":"support","labelEn":"Ask the trusted adult to help you make a simple plan for school, friends and support.","subEn":"","nextSceneId":"e_supported","dynamicType":"clean_boundary","deltas":{"closeness":3,"intimacy":2,"coercion":-2,"karma":4},"labelRu":"Попросить надёжного взрослого помочь составить простой план, который учитывает школу, друзей и поддержку."},{"id":"wait","labelEn":"Say you are not ready to talk more, but agree on how to reach them later.","subEn":"","nextSceneId":"e_choice","dynamicType":"clean_boundary","deltas":{"closeness":1,"coercion":-1,"karma":2},"labelRu":"Сказать, что пока не готов(а) рассказывать больше, но договориться, как связаться позже."}],"stageRu":"Разговор с надёжным взрослым","titleRu":"Ты можешь попросить о поддержке","bodyRu":"Надёжный взрослый выслушивает тебя и не возлагает на тебя ответственность за отношения взрослых. Ты можешь рассказать столько, сколько сам(а) захочешь. Взрослый объясняет: если он обеспокоен твоей безопасностью, ему, возможно, придётся обратиться к людям, чья работа — защищать детей. Он должен как можно понятнее объяснить, что будет происходить.","somaticRu":"Необязательно решать всё за один разговор."}},"endings":{"e_supported":{"tone":"safe","badgeEn":"Support & growth","titleEn":"A life with support and room to grow","bodyEn":"You kept your school, friendships and interests in view while finding support. Adults—not children—are responsible for addressing adult conflict and keeping children safe.","titleRu":"Жизнь, в которой есть поддержка и пространство для роста","bodyRu":"Ты не забывал(а) о школе, друзьях и своих интересах, одновременно находя поддержку. За решение проблем взрослых и безопасность детей отвечают взрослые, а не дети.","badgeRu":"Поддержка и развитие"},"e_choice":{"tone":"safe","badgeEn":"Support & growth","titleEn":"Support remains available","bodyEn":"You chose not to share everything yet. That choice is respected, and you know how to reach a trusted adult later. You deserve support even if you are unsure how to explain what is happening.","titleRu":"Поддержка остаётся доступной","bodyRu":"Ты решил(а) пока не рассказывать всё, и этот выбор уважают. Теперь ты знаешь, как позже связаться с надёжным взрослым. Ты заслуживаешь поддержки, даже если пока не знаешь, как объяснить происходящее.","badgeRu":"Поддержка и развитие"}}},"B":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"A week in a young person’s life","titleEn":"The caregiver’s perspective","bodyEn":"Jamie is 13 and has homework, football, friends and a birthday invitation. You may be preoccupied by adult problems, but Jamie still needs ordinary childhood experiences, privacy and reliable routines.","somaticEn":"Notice the temptation to make the child your confidant or emotional support.","choices":[{"id":"support","labelEn":"Protect time for school, friends and activities; ask what Jamie is looking forward to.","subEn":"","nextSceneId":"s2","dynamicType":"curious_check_in","deltas":{"closeness":3,"intimacy":2,"karma":3},"labelRu":"Защитить время для школы, друзей и занятий; спросить, чего Джейми ждёт с нетерпением."},{"id":"burden","labelEn":"Ask Jamie to take sides or report what the other parent is doing.","subEn":"","nextSceneId":"e_burden","dynamicType":"triangulation","deltas":{"closeness":-5,"intimacy":-4,"coercion":5,"karma":-5},"labelRu":"Попросить Джейми принять чью-либо сторону или докладывать, что делает второй родитель."}],"stageRu":"Неделя из жизни подростка","titleRu":"Взгляд родителя или опекуна","bodyRu":"Джейми 13 лет. У него/неё есть домашние задания, футбол, друзья и приглашение на день рождения. Вы можете быть поглощены проблемами взрослых, но Джейми по-прежнему нужны обычные детские занятия, личное пространство и понятный распорядок.","somaticRu":"Заметьте желание сделать ребёнка своим доверенным лицом или источником эмоциональной поддержки."},"s2":{"stageEn":"A child’s own world","titleEn":"Support without over-monitoring","bodyEn":"Jamie messages about a change in plans. You can ask for reasonable safety information and agree on a return time without demanding passwords, reading every conversation or treating ordinary independence as disloyalty.","somaticEn":"Safety and trust can coexist with age-appropriate privacy.","choices":[{"id":"agree","labelEn":"Agree on a clear check-in and let Jamie enjoy the activity.","subEn":"","nextSceneId":"e_supported","dynamicType":"curious_check_in","deltas":{"closeness":3,"intimacy":2,"coercion":-2,"karma":3},"labelRu":"Договориться о понятном сообщении для проверки связи и позволить Джейми спокойно провести время на занятии."},{"id":"intrude","labelEn":"Demand all passwords and forbid contact with friends who disagree with you.","subEn":"","nextSceneId":"e_burden","dynamicType":"surveillance","deltas":{"closeness":-4,"intimacy":-4,"coercion":6,"ownership":5,"karma":-5},"labelRu":"Потребовать все пароли и запретить общаться с друзьями, которые с вами не согласны."}],"stageRu":"Свой мир","titleRu":"Поддержка без чрезмерного контроля","bodyRu":"Джейми пишет, что планы изменились. Вы можете запросить разумную информацию о безопасности и договориться о времени возвращения, не требуя пароли, не читая каждую переписку и не воспринимая обычную самостоятельность как предательство.","somaticRu":"Безопасность и доверие совместимы с личным пространством, соответствующим возрасту."}},"endings":{"e_supported":{"tone":"safe","badgeEn":"Support & growth","titleEn":"Supporting a whole childhood","bodyEn":"You made room for school, friendships and interests. You remain responsible for adult decisions and do not recruit the child into adult conflict.","titleRu":"Поддержка полноценного детства","bodyRu":"Вы оставили место для школы, дружбы и интересов ребёнка. Вы по-прежнему отвечаете за решения взрослых и не втягиваете ребёнка в конфликт между ними.","badgeRu":"Поддержка и развитие"},"e_burden":{"tone":"coercive","badgeEn":"Safety concern","titleEn":"The child is carrying adult burdens","bodyEn":"Asking a child to take sides, spy, comfort a parent or surrender all privacy can create harmful pressure. Restore age-appropriate boundaries and seek support from a qualified family or child professional.","titleRu":"Ребёнок несёт на себе груз взрослых","bodyRu":"Просьбы принять чью-либо сторону, следить за родителем, утешать его или отказаться от личного пространства создают чрезмерное давление. Восстановите границы, соответствующие возрасту ребёнка, и при необходимости обратитесь к квалифицированному семейному специалисту.","badgeRu":"Риск для безопасности"}}}}},{"id":"child_private_safety","categoryTag":"Youth / Safety & Safeguarding","en":{"shortTitle":"Behind Closed Doors","title":"Behind Closed Doors","subtitle":"A child’s private perspective when punishment becomes frightening or abusive","roleNames":{"A":"Child perspective","B":"Trusted adult"}},"ru":{"shortTitle":"За закрытой дверью","title":"За закрытой дверью","subtitle":"Взгляд ребёнка на наказание, которое становится пугающим или небезопасным","roleNames":{"A":"Ребёнок","B":"Надёжный взрослый"}},"roleTrees":{"A":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"Behind a closed door","titleEn":"When punishment becomes frightening","bodyEn":"You are 14. You have been grounded after coming home late. First, choose what the situation is actually like. A proportionate consequence can be clear, time-limited, explained and connected to safety. A frightening punishment may involve threats, humiliation, physical harm, indefinite isolation or being prevented from reaching safe people. You do not have to decide what to call it before asking for help.","somaticEn":"Your body is alert. You may feel frozen, frightened, angry or unsure whether it is “bad enough” to ask for help.","choices":[{"id":"ordinary_grounding","labelEn":"The grounding is explained, time-limited and I can still attend school and contact safe people.","subEn":"Explore an ordinary consequence and how to discuss it.","nextSceneId":"s_ordinary","dynamicType":"ordinary_conflict","deltas":{"closeness":1,"coercion":-1,"karma":2},"labelRu":"Наказание объяснили, ограничили по времени; я могу ходить в школу и связываться с людьми, которым доверяю.","subRu":"Разберём обычное ограничение и способы его обсудить."},{"id":"abusive_grounding","labelEn":"The adult is threatening, humiliating, frightening or isolating me behind a closed door.","subEn":"Explore a private safety pathway without confronting the adult.","nextSceneId":"s2","dynamicType":"intimidation","deltas":{"coercion":2,"karma":1},"labelRu":"Взрослый угрожает мне, унижает, пугает или изолирует меня за закрытой дверью.","subRu":"Рассмотрим, как получить поддержку, не вступая в конфронтацию со взрослым."},{"id":"unsure_grounding","labelEn":"I am not sure whether this is normal punishment or something unsafe.","subEn":"Explore the concrete signs without needing to label the whole family.","nextSceneId":"s2","dynamicType":"curious_check_in","deltas":{"karma":1},"labelRu":"Я не уверен(а), обычное ли это наказание или ситуация небезопасна.","subRu":"Рассмотрим конкретные признаки, не навешивая ярлык на всю семью."}],"stageRu":"За закрытой дверью","titleRu":"Когда наказание становится пугающим","bodyRu":"Тебе 14 лет. Тебя наказали и запретили выходить из дома после позднего возвращения. Сначала определи, что происходит на самом деле. Соразмерное последствие может быть понятным, ограниченным по времени, объяснённым и связанным с безопасностью. Пугающее наказание может включать угрозы, унижение, физический вред, изоляцию на неопределённый срок или запрет обращаться к людям, которым ты доверяешь. Необязательно сначала решить, как это назвать, чтобы попросить о помощи.","somaticRu":"Твоё тело насторожено. Ты можешь оцепенеть, испугаться, разозлиться или сомневаться, что ситуация «достаточно серьёзная», чтобы просить о помощи."},"s2":{"stageEn":"Private reflection","titleEn":"You do not have to prove anything","bodyEn":"You can privately consider: Are threats being made? Are you being hurt, locked in, deprived of essentials, or prevented from contacting safe people? Is punishment indefinite, humiliating or designed to frighten you? You do not need to label the whole family or make a final decision before asking for help.","somaticEn":"Try to notice what would make the next few minutes safer, not how to fix the adult.","choices":[{"id":"reach","labelEn":"Identify one safe adult and a safe way to reach them.","subEn":"","nextSceneId":"s3","dynamicType":"clean_boundary","deltas":{"coercion":-2,"karma":3},"labelRu":"Определить одного надёжного взрослого и безопасный способ связаться с ним."},{"id":"immediate","labelEn":"If you are in immediate danger, move toward a safer nearby place and contact local emergency help when you can.","subEn":"","nextSceneId":"e_urgent","dynamicType":"clean_boundary","deltas":{"coercion":-3,"karma":4},"labelRu":"Если мне угрожает непосредственная опасность, перейти в более безопасное место поблизости и, когда это возможно, обратиться за экстренной помощью."}],"stageRu":"Личное осмысление","titleRu":"Тебе не нужно ничего доказывать","bodyRu":"Ты можешь спокойно подумать: угрожают ли тебе? Причиняют ли боль, запирают ли, лишают ли необходимого или мешают ли связаться с людьми, которым ты доверяешь? Наказание бессрочное, унизительное или направлено на то, чтобы напугать тебя? Не нужно навешивать ярлык на всю семью или принимать окончательное решение, прежде чем попросить о помощи.","somaticRu":"Подумай, что сделает ближайшие минуты безопаснее, а не о том, как исправить поведение взрослого."},"s3":{"stageEn":"A private conversation","titleEn":"Tell a safe adult what happened","bodyEn":"You speak with a trusted adult, such as a relative, teacher, school counsellor or another responsible professional. You can describe concrete events in your own words. You can ask what they can keep private and what they may need to share to protect you. You are not asked to confront the parent or mediate the family.","somaticEn":"You can pause, ask questions and share at your own pace.","choices":[{"id":"plan","labelEn":"Ask the adult to help make a safety and support plan.","subEn":"","nextSceneId":"e_supported","dynamicType":"clean_boundary","deltas":{"closeness":2,"coercion":-3,"karma":4},"labelRu":"Попросить взрослого помочь составить план безопасности и поддержки."},{"id":"notready","labelEn":"Say you are not ready to explain everything; agree on a safe way to reconnect.","subEn":"","nextSceneId":"e_choice","dynamicType":"clean_boundary","deltas":{"coercion":-1,"karma":2},"labelRu":"Сказать, что я пока не готов(а) всё объяснять, и договориться о безопасном способе снова связаться."}],"stageRu":"Личный разговор","titleRu":"Расскажи надёжному взрослому, что произошло","bodyRu":"Ты разговариваешь с надёжным взрослым — например, родственником, учителем, школьным психологом или другим ответственным специалистом. Ты можешь описать конкретные события своими словами. Можно спросить, что останется конфиденциальным, а чем взрослому, возможно, придётся поделиться ради твоей защиты. От тебя не требуют вступать в конфликт с родителем или быть посредником в семейном конфликте.","somaticRu":"Ты можешь сделать паузу, задать вопросы и рассказывать в своём темпе."},"s_ordinary":{"stageEn":"A proportionate consequence","titleEn":"Grounded, but still respected","bodyEn":"Your parent explains: “You came home an hour late and we were worried. No going out this evening; tomorrow we will talk about how to rebuild trust.” You can still go to school, eat, sleep, contact safe adults and maintain essential relationships. You can ask questions or disagree without being threatened. You may dislike the consequence and still be safe.","somaticEn":"You may feel angry or disappointed. Those feelings do not automatically mean you are being abused.","choices":[{"id":"discuss_limit","labelEn":"Ask when the restriction ends and what would help rebuild trust.","subEn":"A clear consequence can be discussed.","nextSceneId":"e_ordinary","dynamicType":"curious_check_in","deltas":{"closeness":2,"intimacy":1,"coercion":-1,"karma":2},"labelRu":"Спросить, когда закончится ограничение и что поможет восстановить доверие.","subRu":"Понятное ограничение можно обсудить."},{"id":"disagree_safe","labelEn":"Say you disagree, while accepting that the parent may keep a reasonable limit.","subEn":"Disagreement is allowed on both sides.","nextSceneId":"e_ordinary","dynamicType":"child_self_advocacy","deltas":{"closeness":1,"coercion":-1,"karma":2},"labelRu":"Сказать, что я не согласен(на), признавая, что родитель может сохранить разумное ограничение.","subRu":"Обе стороны могут выражать несогласие."}],"stageRu":"Соразмерное последствие","titleRu":"Ограничение, но с уважением","bodyRu":"Родитель объясняет: «Ты опоздал(а) на час, и мы волновались. Сегодня вечером ты не идёшь гулять; завтра обсудим, как восстановить доверие». Ты по-прежнему можешь ходить в школу, есть, спать, связываться с безопасными взрослыми и поддерживать важные отношения. Ты можешь задавать вопросы и не соглашаться, не опасаясь угроз. Тебе может не нравиться это ограничение, и при этом ты можешь оставаться в безопасности.","somaticRu":"Ты можешь злиться или расстраиваться. Сами по себе эти чувства не означают, что с тобой жестоко обращаются."}},"endings":{"e_supported":{"tone":"safe","badgeEn":"Support & safety","titleEn":"A safer adult takes responsibility","bodyEn":"A trusted adult helps assess safety and connect you with appropriate support. You are not responsible for changing the abusive adult. The next steps should be guided by your safety, age and local child-protection options.","titleRu":"Ответственность берёт на себя безопасный взрослый","bodyRu":"Надёжный взрослый помогает оценить безопасность и найти подходящую поддержку. Ты не отвечаешь за то, чтобы изменить поведение взрослого, который причиняет вред. Дальнейшие шаги должны учитывать твою безопасность, возраст и доступные в твоём регионе службы защиты детей.","badgeRu":"Поддержка и безопасность"},"e_choice":{"tone":"safe","badgeEn":"Support & safety","titleEn":"The door to support stays open","bodyEn":"You are not forced to disclose everything at once. A safe adult helps you know how to reconnect. If danger becomes immediate, seek emergency help as soon as it is safe.","titleRu":"Возможность обратиться за помощью остаётся","bodyRu":"Тебя не заставляют рассказывать всё сразу. Надёжный взрослый помогает понять, как снова связаться с ним. Если опасность станет непосредственной, обратись за экстренной помощью, как только это будет безопасно.","badgeRu":"Поддержка и безопасность"},"e_urgent":{"tone":"safe","badgeEn":"Support & safety","titleEn":"Immediate safety comes first","bodyEn":"The priority is getting away from immediate danger and contacting local emergency services or child-protection support. Do not risk a confrontation to collect proof or persuade the adult.","titleRu":"Сначала — непосредственная безопасность","bodyRu":"Главное — уйти от непосредственной опасности и связаться с местными экстренными службами или службой защиты детей. Не рискуй, пытаясь вступить в конфликт или убедить взрослого, и не пытайся собирать доказательства.","badgeRu":"Поддержка и безопасность"},"e_ordinary":{"tone":"safe","badgeEn":"Proportionate discipline","titleEn":"A consequence is not automatically abuse","bodyEn":"A reasonable, explained, proportionate and time-limited consequence is different from intimidation or cruelty. The child can dislike it, ask questions and express disagreement while basic safety, dignity, education and access to trusted people remain protected.","titleRu":"Последствие не означает насилие","bodyRu":"Разумное, объяснённое, соразмерное и ограниченное по времени последствие отличается от запугивания и жестокости. Ребёнок может быть недоволен, задавать вопросы и выражать несогласие, при этом его безопасность, достоинство, образование и доступ к надёжным людям должны оставаться защищёнными.","badgeRu":"Соразмерное воспитательное ограничение"}}},"B":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"Behind a closed door","titleEn":"The observing adult’s perspective","bodyEn":"You are a teacher, relative or trusted adult. A 14-year-old tells you they were grounded, shouted at, threatened and told they would never see friends again. Do not dismiss this as “strict parenting.” Listen calmly, ask whether they are safe right now, and avoid promising absolute secrecy.","somaticEn":"Your role is to take the concern seriously without interrogating or making the child repeat details unnecessarily.","choices":[{"id":"listen","labelEn":"Listen, thank them for telling you and ask what they need to feel safe right now.","subEn":"","nextSceneId":"s2","dynamicType":"curious_check_in","deltas":{"closeness":2,"intimacy":2,"karma":3},"labelRu":"Выслушать ребёнка, поблагодарить за доверие и спросить, что поможет ему/ей почувствовать себя в безопасности прямо сейчас."},{"id":"dismiss","labelEn":"Tell them all parents shout and they should obey.","subEn":"","nextSceneId":"e_fail","dynamicType":"dismissal","deltas":{"closeness":-5,"intimacy":-5,"coercion":5,"karma":-5},"labelRu":"Сказать, что все родители кричат и ребёнок должен просто слушаться."}],"stageRu":"За закрытой дверью","titleRu":"Взгляд взрослого, которому доверяют","bodyRu":"Вы — учитель, родственник или другой надёжный взрослый. Четырнадцатилетний подросток рассказывает, что его/её наказали, кричали на него/неё, угрожали и сказали, что он/она больше никогда не увидит друзей. Не списывайте это на «строгое воспитание». Спокойно выслушайте, спросите, находится ли ребёнок сейчас в безопасности, и не обещайте абсолютную тайну.","somaticRu":"Ваша задача — отнестись к ситуации серьёзно, не устраивая допрос и не заставляя ребёнка многократно повторять подробности."},"s2":{"stageEn":"Assess immediate safety","titleEn":"Do not turn the child into an investigator","bodyEn":"Ask simple, non-leading questions about immediate safety and urgent needs. Do not ask them to confront the parent, gather evidence, secretly record, or mediate. Follow your professional safeguarding duties and local procedures. Explain honestly what information may need to be shared and with whom.","somaticEn":"Stay calm, concrete and transparent.","choices":[{"id":"safeguard","labelEn":"Follow the relevant child-safeguarding process and help connect the child with appropriate support.","subEn":"","nextSceneId":"e_supported","dynamicType":"honest_repair","deltas":{"coercion":-3,"karma":5},"labelRu":"Следовать соответствующей процедуре защиты ребёнка и помочь получить необходимую поддержку."},{"id":"promise","labelEn":"Promise to keep everything secret and handle the parent yourself.","subEn":"","nextSceneId":"e_fail","dynamicType":"intimidation","deltas":{"coercion":4,"karma":-4},"labelRu":"Пообещать сохранить всё в тайне и самостоятельно разобраться с родителем."}],"stageRu":"Проверка непосредственной безопасности","titleRu":"Не превращайте ребёнка в следователя","bodyRu":"Задавайте простые, нейтральные вопросы о непосредственной безопасности и срочных потребностях. Не просите ребёнка вступать в конфронтацию с родителем, собирать доказательства, тайно записывать происходящее или быть посредником. Соблюдайте профессиональные обязанности по защите детей и местные процедуры. Честно объясните, какой информацией, возможно, придётся поделиться и с кем.","somaticRu":"Сохраняйте спокойствие, говорите конкретно и открыто."}},"endings":{"e_supported":{"tone":"safe","badgeEn":"Child protection","titleEn":"Safeguarding, not confrontation","bodyEn":"You listened, checked immediate safety, avoided placing responsibility on the child and followed appropriate safeguarding pathways. Local law and professional duties determine the exact reporting and referral steps.","titleRu":"Защита ребёнка, а не конфронтация","bodyRu":"Вы выслушали ребёнка, проверили непосредственную безопасность, не возложили на него ответственность и последовали соответствующим процедурам защиты. Конкретные действия по сообщению и направлению за помощью определяются местным законодательством и профессиональными обязанностями.","badgeRu":"Защита ребёнка"},"e_fail":{"tone":"coercive","badgeEn":"Safety concern","titleEn":"Dismissal or secrecy can increase risk","bodyEn":"Dismissing threats or promising secrecy can leave a child without protection. Re-centre the child’s immediate safety, follow safeguarding duties and consult appropriate local professionals.","titleRu":"Обесценивание или обещание тайны могут повысить риск","bodyRu":"Если отмахнуться от угроз или пообещать сохранить всё в тайне, ребёнок может остаться без защиты. Вернитесь к вопросу его непосредственной безопасности, соблюдайте обязанности по защите детей и проконсультируйтесь с местными специалистами.","badgeRu":"Риск для безопасности"}}}}},{"id":"money_pleasure_without_performance","categoryTag":"Money / Dating / Self-Regulation","en":{"shortTitle":"Money Without the Performance","title":"The Payday Loop: Money, Dating & Real Pleasure","subtitle":"Learning to enjoy life without buying approval or burning through every windfall","roleNames":{"A":"The Man","B":"The Date"}},"ru":{"shortTitle":"Деньги без показухи","title":"Цикл после крупного заработка: деньги, свидания и настоящее удовольствие","subtitle":"Как получать удовольствие от жизни, не покупая одобрение и не спуская каждый крупный доход","roleNames":{"A":"Мужчина","B":"Девушка на свидании"}},"roleTrees":{"A":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"The payday spike","titleEn":"A familiar high-income weekend","bodyEn":"You're 34, a freelance deal-maker. Some months are lean; then a project closes and a large payment lands. Your first thought is to turn the money into a spectacular weekend: a luxury hotel, expensive dinners, gifts and rounds of drinks. Dating feels exciting when you can make everything impressive. You also know this pattern: by the end of the month, the money is gone and ordinary life feels flat.","somaticEn":"Energy surges; your mind races ahead to the reaction you might get.","choices":[{"id":"big_night","labelEn":"Book the expensive weekend. You want to feel successful now.","labelRu":"Забронировать дорогой уик-энд. Сейчас хочется почувствовать себя успешным.","subEn":"","subRu":"","nextSceneId":"s2","dynamicType":"soft_pressure","deltas":{"closeness":1,"intimacy":1,"coercion":2,"ownership":5,"karma":-2}},{"id":"set_limit","labelEn":"Decide on a dating-and-fun budget before making plans.","labelRu":"Сначала определить бюджет на свидания и удовольствие, а потом строить планы.","subEn":"","subRu":"","nextSceneId":"s3","dynamicType":"clean_boundary","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-5,"karma":3}},{"id":"withdraw","labelEn":"Decide that dating and pleasure are a waste of money; shut everything down.","labelRu":"Решить, что свидания и удовольствие — пустая трата денег, и вообще от всего отказаться.","subEn":"","subRu":"","nextSceneId":"s4","dynamicType":"moving_goalposts","deltas":{"closeness":-1,"intimacy":-1,"coercion":0,"ownership":1,"karma":-1}},{"id":"nothing_needed","labelEn":"I'm a good person. I don't need anything from women.","labelRu":"Я добрый человек. Мне от женщин ничего не нужно.","subEn":"Explore whether this means genuine contentment, or that you have stopped expecting your own needs to matter.","subRu":"Исследуй, означает ли это настоящее удовлетворение жизнью или то, что ты перестал ждать, что твои потребности будут иметь значение.","nextSceneId":"s5","dynamicType":"curious_check_in","deltas":{"closeness":0,"intimacy":1,"coercion":-1,"ownership":-2,"karma":2}}],"stageRu":"Резкий подъём после оплаты","titleRu":"Знакомый сценарий после крупного заработка","bodyRu":"Тебе 34 года. Ты работаешь на проектах: бывают спокойные месяцы, а потом закрывается крупная сделка и приходит большая сумма. Первая мысль — устроить впечатляющий уик-энд: дорогой отель, рестораны, подарки, напитки за всех. Свидания кажутся особенно захватывающими, когда можно всё сделать эффектно. Но ты знаешь и продолжение: к концу месяца деньги заканчиваются, а обычная жизнь кажется пресной.","somaticRu":"Прилив энергии; мысли уже бегут к тому, какое впечатление ты произведёшь."},"s2":{"stageEn":"The month after","titleEn":"The bill arrives","bodyEn":"The weekend was exciting. Nobody forced you to spend it. Your date enjoyed parts of it, but did not ask you to empty your account. Now rent, taxes and business costs are due. You feel embarrassed and irritated. It is tempting to rewrite the story as “women are expensive” or “I had no choice,” but the spending decisions were yours.","somaticEn":"Stomach tightens as you open the banking app.","choices":[{"id":"blame","labelEn":"Tell your date she made you spend too much and expect her to compensate you emotionally or financially.","labelRu":"Сказать девушке, что из-за неё ты потратил слишком много, и ждать, что она компенсирует это деньгами или вниманием.","subEn":"","subRu":"","nextSceneId":"e_blame","dynamicType":"soft_pressure","deltas":{"closeness":-5,"intimacy":-4,"coercion":5,"ownership":5,"karma":-5}},{"id":"own_it","labelEn":"Name the pattern without blaming her. Review the actual numbers and make a recovery plan.","labelRu":"Назвать свой повторяющийся сценарий, не обвиняя её. Посмотреть на реальные цифры и составить план восстановления.","subEn":"","subRu":"","nextSceneId":"s3","dynamicType":"honest_repair","deltas":{"closeness":1,"intimacy":2,"coercion":-2,"ownership":-5,"karma":4}}],"stageRu":"Следующий месяц","titleRu":"Счёт за удовольствие","bodyRu":"Уик-энд был ярким. Никто не заставлял тебя тратить деньги. Девушке понравились некоторые моменты, но она не просила опустошать твой счёт. Теперь нужно оплачивать жильё, налоги и рабочие расходы. Тебе неловко и досадно. Хочется переписать историю в духе «женщины слишком дорого обходятся» или «у меня не было выбора», но решения о расходах принимал ты сам.","somaticRu":"Живот сжимается, когда ты открываешь банковское приложение."},"s3":{"stageEn":"A different pleasure menu","titleEn":"What actually makes life feel good?","bodyEn":"A friend asks what you enjoy when nobody is watching and you are not trying to impress a date. You struggle to answer. The list is longer than you expect: playing football, learning to cook, making music, swimming, hiking, fixing a motorbike, seeing friends, taking a low-cost day trip, building something, reading, volunteering, resting. These are not consolation prizes. They are sources of pleasure that don't depend on buying someone's attention.","somaticEn":"At first you feel restless; then a little curiosity appears.","choices":[{"id":"build_mix","labelEn":"Create a realistic monthly plan: essentials, taxes, a reserve, personal fun, dating and generosity.","labelRu":"Составить реалистичный месячный план: обязательные расходы, налоги, резерв, личные удовольствия, свидания и подарки.","subEn":"","subRu":"","nextSceneId":"s4","dynamicType":"clean_boundary","deltas":{"closeness":2,"intimacy":1,"coercion":-2,"ownership":-6,"karma":4}},{"id":"repeat_spend","labelEn":"Tell yourself the next big payment will solve everything and plan another expensive night.","labelRu":"Убедить себя, что следующая крупная оплата всё исправит, и запланировать ещё один дорогой вечер.","subEn":"","subRu":"","nextSceneId":"e_loop","dynamicType":"moving_goalposts","deltas":{"closeness":0,"intimacy":0,"coercion":2,"ownership":6,"karma":-4}}],"stageRu":"Другой список удовольствий","titleRu":"Что на самом деле приносит радость?","bodyRu":"Друг спрашивает, что тебе нравится, когда рядом никого не нужно впечатлять и не нужно производить впечатление на девушку. Сначала трудно ответить. Но список оказывается длиннее, чем ожидалось: футбол, кулинария, музыка, плавание, походы, ремонт мотоцикла, встречи с друзьями, недорогие поездки на день, создание чего-то своими руками, чтение, волонтёрство, отдых. Это не утешительные замены. Это самостоятельные источники удовольствия, которые не зависят от покупки чужого внимания.","somaticRu":"Сначала появляется беспокойство, потом — любопытство."},"s4":{"stageEn":"A date with a real budget","titleEn":"Generosity without a performance","bodyEn":"You invite someone you like to spend an evening together. You suggest street food and a walk by the sea, or cooking together. You say plainly: “I enjoy treating people, but I don't want to spend money to prove my worth. I’m keeping to a budget.” A respectful person may prefer another plan, but can discuss it without mocking you. If someone only wants the expensive version, that may simply mean you want different things.","somaticEn":"Your shoulders drop when you stop performing.","choices":[{"id":"mutual","labelEn":"Agree on a plan you both genuinely enjoy and can afford. Keep gifts voluntary, not a test or a debt.","labelRu":"Выбрать план, который вам обоим действительно нравится и по карману. Пусть подарки будут добровольными, а не проверкой или долгом.","subEn":"","subRu":"","nextSceneId":"e_new_pattern","dynamicType":"curious_check_in","deltas":{"closeness":4,"intimacy":3,"coercion":-3,"ownership":-5,"karma":5}},{"id":"prove","labelEn":"Ignore your budget and upgrade the evening so she won't lose interest.","labelRu":"Забыть о бюджете и сделать вечер ещё дороже, чтобы она не потеряла интерес.","subEn":"","subRu":"","nextSceneId":"e_loop","dynamicType":"soft_pressure","deltas":{"closeness":-1,"intimacy":-1,"coercion":3,"ownership":5,"karma":-3}},{"id":"different","labelEn":"If your expectations differ, acknowledge it respectfully and don't buy agreement.","labelRu":"Если ваши ожидания не совпадают, спокойно признать это и не пытаться купить согласие.","subEn":"","subRu":"","nextSceneId":"e_boundary","dynamicType":"clean_boundary","deltas":{"closeness":1,"intimacy":1,"coercion":-2,"ownership":-4,"karma":3}}],"stageRu":"Свидание без спектакля","titleRu":"Щедрость без демонстрации","bodyRu":"Ты приглашаешь девушку, которая тебе нравится, провести вечер вместе. Предлагаешь уличную еду и прогулку у моря или совместно приготовить ужин. Говоришь прямо: «Мне нравится угощать близких, но я не хочу доказывать свою ценность деньгами. Я придерживаюсь бюджета». Уважительный человек может предложить другой вариант, но способен обсудить его без насмешек. Если кому-то подходит только дорогой формат, возможно, вы просто хотите разного.","somaticRu":"Плечи расслабляются, когда больше не нужно играть роль."},"s5":{"stageEn":"The sentence underneath the spending","titleEn":"“I'm a good person. I don't need anything.”","bodyEn":"You describe yourself as kind and say you don't need anything from women. You may mean that sincerely: you are not asking for gifts, money or repayment. But a friend asks a different question: do you still want closeness, affection, interest, rest or someone who asks how you are? Not demanding something from another person is not the same as having no needs.","somaticEn":"Notice whether the sentence feels calm and true, or flat, guarded or difficult to question.","stageRu":"Что стоит за этой фразой","titleRu":"«Я добрый человек. Мне ничего не нужно».","bodyRu":"Ты описываешь себя как доброго человека и говоришь, что от женщин тебе ничего не нужно. Возможно, ты действительно имеешь в виду именно это: ты не просишь подарков, денег или возврата затрат. Но друг задаёт другой вопрос: нужны ли тебе близость, нежность, внимание, отдых или человек, который сам спросит, как ты? Не требовать ничего от другого — не то же самое, что вообще не иметь потребностей.","somaticRu":"Заметь, звучит ли эта фраза спокойно и правдиво или скорее плоско, настороженно, так, что её трудно поставить под вопрос.","choices":[{"id":"truly_content","labelEn":"It feels true. I enjoy my life and can say what I want when I want it.","labelRu":"Это правда. Мне нравится моя жизнь, и я могу прямо сказать, чего хочу.","subEn":"","subRu":"","nextSceneId":"s6","dynamicType":"curious_check_in","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-3,"karma":2}},{"id":"stopped_expect","labelEn":"Maybe I stopped expecting people to notice what I need.","labelRu":"Возможно, я просто перестал ждать, что люди заметят, чего мне не хватает.","subEn":"","subRu":"","nextSceneId":"s7","dynamicType":"honest_repair","deltas":{"closeness":1,"intimacy":1,"coercion":0,"ownership":-2,"karma":2}},{"id":"not_sure_needs","labelEn":"I honestly don't know what I need. I want to think about it without forcing an answer.","labelRu":"Я правда не знаю, что мне нужно. Хочу подумать об этом, не заставляя себя немедленно отвечать.","subEn":"","subRu":"","nextSceneId":"s7","dynamicType":"curious_check_in","deltas":{"closeness":0,"intimacy":1,"coercion":-1,"ownership":-2,"karma":2}}]},"s6":{"stageEn":"Needs without a hidden contract","titleEn":"Can you ask without paying?","bodyEn":"Imagine saying: “I don't need you to buy me anything. I would like to spend time together, and I'd enjoy some affection.” You can ask clearly and leave the other person free to answer. If they say no or want something different, that is information—not proof that you must spend more, become colder or punish them.","somaticEn":"Notice the urge to offer money, make a joke, withdraw or pretend you never wanted anything.","stageRu":"Потребности без скрытой сделки","titleRu":"Можно ли попросить, ничего не оплачивая?","bodyRu":"Представь, что ты говоришь: «Мне не нужно, чтобы ты что-то покупала. Я хочу провести с тобой время, и мне была бы приятна нежность». Можно попросить прямо и оставить другому человеку свободу ответа. Если она откажет или захочет другого, это информация, а не доказательство, что нужно потратить больше, закрыться или наказать её.","somaticRu":"Заметь желание предложить деньги, отшутиться, отстраниться или сделать вид, будто тебе ничего и не хотелось.","choices":[{"id":"ask_directly","labelEn":"Say what I want plainly, without attaching a gift or obligation.","labelRu":"Прямо сказать, чего я хочу, не привязывая просьбу к подарку или обязательству.","subEn":"","subRu":"","nextSceneId":"s8","dynamicType":"clean_boundary","deltas":{"closeness":2,"intimacy":2,"coercion":-1,"ownership":-4,"karma":3}},{"id":"offer_instead","labelEn":"Offer something expensive instead; asking feels too exposed.","labelRu":"Вместо этого предложить что-нибудь дорогое: просить напрямую слишком уязвимо.","subEn":"","subRu":"","nextSceneId":"s4","dynamicType":"soft_pressure","deltas":{"closeness":0,"intimacy":-1,"coercion":1,"ownership":2,"karma":-1}}]},"s7":{"stageEn":"Looking back without deciding the story in advance","titleEn":"Could you have learned not to expect much?","bodyEn":"You can wonder whether earlier relationships or family experiences involved humiliation, control, emotional neglect, exploitation or affection that felt conditional. You do not have to label anything as abuse, recover memories or choose an explanation now. “I don't know” is a valid answer. Focus on what you remember, how it affected you, and what support would feel useful today.","somaticEn":"Pause if this feels overwhelming. You can skip the reflection and return to the present.","stageRu":"Взгляд в прошлое без готового диагноза","titleRu":"Мог ли ты привыкнуть ничего не ждать?","bodyRu":"Можно осторожно задуматься, были ли в прошлых отношениях или семье унижение, контроль, эмоциональное пренебрежение, использование или любовь, которую приходилось заслуживать. Не нужно называть это абьюзом, пытаться восстановить воспоминания или прямо сейчас выбирать объяснение. «Я не знаю» — полноценный ответ. Ориентируйся на то, что действительно помнишь, как это на тебя повлияло и какая поддержка была бы полезна сейчас.","somaticRu":"Если становится слишком тяжело, остановись. Можно пропустить это размышление и вернуться к настоящему.","choices":[{"id":"name_impact","labelEn":"I can name something I remember and how it affected me.","labelRu":"Я могу назвать то, что помню, и рассказать, как это на меня повлияло.","subEn":"","subRu":"","nextSceneId":"s8","dynamicType":"honest_repair","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-2,"karma":2}},{"id":"unsure_skip","labelEn":"I'm not sure. I don't want to force an interpretation; I'll focus on what I need now.","labelRu":"Не уверен. Не хочу навязывать себе объяснение; лучше сосредоточусь на том, что мне нужно сейчас.","subEn":"","subRu":"","nextSceneId":"s8","dynamicType":"curious_check_in","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-2,"karma":2}}]},"s8":{"stageEn":"A small, real boundary","titleEn":"Connection without the expensive performance","bodyEn":"The next time a large payment arrives, you decide what you can comfortably spend before inviting someone out. You can say: “I can't spend that much, but I'd still like to see you.” You can also choose a simple pleasure for yourself—sport, friends, cooking, music, nature, learning or rest. If someone only wants the expensive version, you can decide whether that relationship suits you without accusing them or buying their approval.","somaticEn":"A boundary may feel unfamiliar. Let the discomfort pass without immediately undoing the limit.","stageRu":"Небольшая, настоящая граница","titleRu":"Близость без дорогого представления","bodyRu":"В следующий раз, когда придёт крупная оплата, ты заранее решаешь, сколько можешь спокойно потратить, и только потом приглашаешь человека. Можно сказать: «Я не могу потратить столько, но всё равно хочу тебя увидеть». Можно выбрать простое удовольствие и для себя: спорт, друзей, готовку, музыку, природу, обучение или отдых. Если человеку подходит только дорогой формат, ты можешь решить, подходят ли тебе такие отношения, не обвиняя его и не покупая одобрение.","somaticRu":"Граница может ощущаться непривычно. Позволь дискомфорту пройти, не отменяя своё решение автоматически.","choices":[{"id":"sustainable_choice","labelEn":"Keep the limit, ask directly for connection and choose pleasures that don't wreck next month's life.","labelRu":"Сохранить лимит, прямо просить о близости и выбирать удовольствие, которое не разрушает следующий месяц.","subEn":"","subRu":"","nextSceneId":"e_new_pattern","dynamicType":"clean_boundary","deltas":{"closeness":2,"intimacy":2,"coercion":-2,"ownership":-5,"karma":4}},{"id":"need_more_time","labelEn":"I need more time and perhaps a trusted person or professional to explore this safely.","labelRu":"Мне нужно больше времени и, возможно, поддержка близкого человека или специалиста, чтобы спокойно в этом разобраться.","subEn":"","subRu":"","nextSceneId":"e_self_understanding","dynamicType":"curious_check_in","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-3,"karma":3}}]}},"endings":{"e_blame":{"tone":"coercive","titleEn":"Blame replaces responsibility","bodyEn":"Your date did not control your spending. Turning your own choice into their debt creates resentment and pressure. The practical work is to own the decision, review your finances and change the pattern.","badgeEn":"A costly story about blame","titleRu":"Обвинение вместо ответственности","bodyRu":"Девушка не управляла твоими расходами. Превращая собственное решение в её долг, ты создаёшь обиду и давление. Практический шаг — признать свой выбор, разобраться с финансами и изменить сценарий.","badgeRu":"Обвинение и давление"},"e_loop":{"tone":"coercive","titleEn":"The loop repeats","bodyEn":"A windfall becomes a performance, the performance drains the money, and the empty account creates shame. The next payment is not a plan. Interrupt the cycle with a written budget, a reserve and sources of pleasure that are not purchases.","badgeEn":"The expensive loop","titleRu":"Цикл повторяется","bodyRu":"Крупный доход превращается в спектакль, спектакль опустошает счёт, а пустой счёт приносит стыд. Следующая оплата — не финансовый план. Прерви цикл: составь бюджет, создай резерв и найди источники удовольствия, не связанные с покупками.","badgeRu":"Дорогой повторяющийся сценарий"},"e_new_pattern":{"tone":"safe","titleEn":"More than one way to feel alive","bodyEn":"You kept generosity, but removed the performance. You have a plan for essentials and savings, and you invest in sport, friendships, creativity, rest, learning and dates that fit your real budget. Pleasure becomes part of ordinary life instead of a short, expensive peak.","badgeEn":"A sustainable pleasure plan","titleRu":"Несколько способов чувствовать вкус к жизни","bodyRu":"Ты не отказался от щедрости — ты отказался от необходимости что-то доказывать. У тебя есть план обязательных расходов и накоплений, а также место для спорта, друзей, творчества, отдыха, обучения и свиданий по реальному бюджету. Удовольствие становится частью обычной жизни, а не коротким и дорогим пиком.","badgeRu":"Устойчивый источник удовольствия"},"e_boundary":{"tone":"safe","titleEn":"Different expectations, clear choice","bodyEn":"You did not need to buy agreement or prove your worth. You can choose people and activities that fit your values and budget. A mismatch is information, not a verdict on your value.","badgeEn":"Clear boundary","titleRu":"Разные ожидания — ясный выбор","bodyRu":"Тебе не пришлось покупать согласие или доказывать свою ценность. Ты можешь выбирать людей и занятия, которые соответствуют твоим ценностям и бюджету. Несовпадение ожиданий — это информация, а не оценка твоей значимости.","badgeRu":"Ясная граница"},"e_self_understanding":{"tone":"reflective","titleEn":"You don't have to solve your history today","bodyEn":"You noticed that giving freely and having no needs are not the same thing. You do not need to decide whether past experiences were abuse to take your present feelings seriously. Keep practising clear requests and limits; consider a trusted, trauma-informed professional if these questions feel persistent or painful. Your history may help explain a pattern, but it does not remove anyone's responsibility for their choices.","badgeEn":"Room for self-understanding","titleRu":"Необязательно разбираться со всей своей историей сегодня","bodyRu":"Ты заметил, что свободно дарить и не иметь потребностей — не одно и то же. Не нужно решать, был ли прошлый опыт абьюзом, чтобы относиться серьёзно к своим нынешним чувствам. Продолжай практиковать прямые просьбы и границы; если эти вопросы долго не отпускают или причиняют боль, можно обратиться к специалисту, работающему бережно с травматическим опытом. Прошлое может объяснять некоторые привычки, но не снимает ответственности за собственные поступки.","badgeRu":"Пространство для самопонимания"}}},"B":{"startSceneId":"s1","scenes":{"s1":{"stageEn":"A generous invitation","titleEn":"A date that feels like a performance","bodyEn":"You are getting to know a man who has just received a large project payment. He books an expensive dinner and offers gifts. You may enjoy being treated; accepting a gift does not make you manipulative or indebted. You also notice he keeps checking whether you are impressed. You did not ask him to spend this much, and you don't want the evening to create an obligation.","somaticEn":"You feel both flattered and slightly on guard.","choices":[{"id":"appreciate","labelEn":"Thank him, while making clear that a gift doesn't create an obligation.","labelRu":"Поблагодарить, одновременно обозначив, что подарок не создаёт обязательств.","subEn":"","subRu":"","nextSceneId":"s2","dynamicType":"curious_check_in","deltas":{"closeness":1,"intimacy":1,"coercion":-1,"ownership":-2,"karma":2}},{"id":"ask_direct","labelEn":"Ask whether this level of spending is comfortable for him and say what kind of date you actually enjoy.","labelRu":"Спросить, комфортны ли ему такие расходы, и сказать, какие свидания нравятся тебе на самом деле.","subEn":"","subRu":"","nextSceneId":"s2","dynamicType":"clean_boundary","deltas":{"closeness":1,"intimacy":2,"coercion":-1,"ownership":-3,"karma":3}},{"id":"ignore_signal","labelEn":"Enjoy the expensive evening without assuming you know what the spending means; check in if pressure appears.","labelRu":"Насладиться дорогим вечером, не делая выводов о мотивах; обсудить это, если появится давление.","subEn":"","subRu":"","nextSceneId":"s2","dynamicType":"curious_check_in","deltas":{"closeness":0,"intimacy":1,"coercion":0,"ownership":-1,"karma":1}}],"stageRu":"Щедрое приглашение","titleRu":"Свидание как представление","bodyRu":"Ты знакомишься с мужчиной, которому только что пришла крупная оплата за проект. Он приглашает тебя в дорогой ресторан и предлагает подарки. Тебе может быть приятно такое внимание; принять подарок — не значит манипулировать им или становиться должной. Но ты замечаешь, что он постоянно проверяет, впечатлена ли ты. Ты не просила его столько тратить и не хочешь, чтобы вечер создавал обязательства.","somaticRu":"Тебе одновременно приятно и немного не по себе."},"s2":{"stageEn":"The conversation","titleEn":"What the money is meant to say","bodyEn":"He says he likes being generous, but admits that he sometimes spends more than he can afford because he fears seeming ordinary or losing someone's interest. You can be honest without becoming his therapist or financial manager. His spending is his responsibility; your boundaries and preferences are yours.","somaticEn":"You notice the conversation becomes easier when nobody has to perform.","choices":[{"id":"clear","labelEn":"Say that you value time, attention and shared interests more than expensive proof of affection.","labelRu":"Сказать, что для тебя важнее совместное время, внимание и общие интересы, а не дорогие доказательства чувств.","subEn":"","subRu":"","nextSceneId":"s3","dynamicType":"curious_check_in","deltas":{"closeness":3,"intimacy":3,"coercion":-2,"ownership":-3,"karma":4}},{"id":"boundary","labelEn":"Say you are not comfortable with gifts that later become leverage or a reason to expect sex, loyalty or constant availability.","labelRu":"Сказать, что тебе не подходят подарки, которые потом превращают в рычаг давления или повод требовать секс, верность либо постоянную доступность.","subEn":"","subRu":"","nextSceneId":"e_boundary","dynamicType":"clean_boundary","deltas":{"closeness":1,"intimacy":2,"coercion":-3,"ownership":-3,"karma":4}},{"id":"name_pressure","labelEn":"If he later treats the gift as a debt, say clearly that you never agreed to that.","labelRu":"Если позже он начнёт считать подарок долгом, прямо сказать, что ты на это не соглашалась.","subEn":"","subRu":"","nextSceneId":"e_unclear_expectations","dynamicType":"clean_boundary","deltas":{"closeness":0,"intimacy":1,"coercion":-2,"ownership":-3,"karma":2}}],"stageRu":"Разговор","titleRu":"Что должны означать деньги","bodyRu":"Он говорит, что любит быть щедрым, но признаёт: иногда тратит больше, чем может себе позволить, потому что боится показаться обычным или потерять интерес другого человека. Ты можешь быть честной, не становясь его терапевтом или финансовым управляющим. Его расходы — его ответственность; твои границы и предпочтения — твои.","somaticRu":"Разговор становится проще, когда никому не нужно играть роль."},"s3":{"stageEn":"A simple evening","titleEn":"Pleasure without a price tag","bodyEn":"You suggest cooking together, going for a swim, watching a film at home, visiting a free event or meeting friends. He seems unsure at first, as if a cheaper plan means he has failed. You remind him that the point is to enjoy each other's company, not to stage a financial audition.","somaticEn":"Warmth grows when the plan feels mutual.","choices":[{"id":"enjoy","labelEn":"Choose an activity you both like and split or share costs in a way that feels comfortable to both.","labelRu":"Выбрать занятие, которое нравится вам обоим, и распределить расходы так, как комфортно каждому.","subEn":"","subRu":"","nextSceneId":"e_mutual","dynamicType":"honest_repair","deltas":{"closeness":4,"intimacy":3,"coercion":-2,"ownership":-4,"karma":5}},{"id":"not_compatible","labelEn":"If he keeps using money to create obligation, step back rather than trying to change him.","labelRu":"Если он продолжает превращать деньги в обязательства, отстраниться, а не пытаться его переделать.","subEn":"","subRu":"","nextSceneId":"e_boundary","dynamicType":"clean_boundary","deltas":{"closeness":0,"intimacy":1,"coercion":-3,"ownership":-3,"karma":3}}],"stageRu":"Простой вечер","titleRu":"Удовольствие не измеряется ценой","bodyRu":"Ты предлагаешь приготовить ужин вместе, сходить поплавать, посмотреть фильм дома, посетить бесплатное мероприятие или встретиться с друзьями. Сначала он сомневается, словно более дешёвый план означает, что он не справился. Ты напоминаешь: смысл в том, чтобы провести время вместе, а не устраивать финансовое прослушивание.","somaticRu":"Тепло появляется, когда план становится общим."}},"endings":{"e_boundary":{"tone":"safe","titleEn":"You are not responsible for managing his money","bodyEn":"You stated what is and is not comfortable for you. He is responsible for his spending and for changing the pattern. You can stay, step back or leave; you do not owe him therapy, budgeting or intimacy because he paid.","badgeEn":"A clear boundary","titleRu":"Ты не отвечаешь за его деньги","bodyRu":"Ты обозначила, что тебе подходит, а что нет. Он отвечает за свои расходы и за изменение своего сценария. Ты можешь продолжить общение, отдалиться или уйти; ты не обязана становиться его терапевтом, финансовым консультантом или вступать в близость потому, что он заплатил.","badgeRu":"Ясная граница"},"e_mutual":{"tone":"safe","titleEn":"A relationship, not a transaction","bodyEn":"You both chose an activity you enjoy. Money stayed a practical detail rather than a test, debt or proof of affection. Shared pleasure can be inexpensive, generous and mutual.","badgeEn":"Mutual enjoyment","titleRu":"Отношения, а не сделка","bodyRu":"Вы вместе выбрали занятие, которое нравится обоим. Деньги остались практической деталью, а не проверкой, долгом или доказательством чувств. Совместное удовольствие может быть недорогим, щедрым и взаимным.","badgeRu":"Взаимное удовольствие"},"e_unclear_expectations":{"tone":"reflective","titleEn":"Don't guess the contract","bodyEn":"A generous gesture can be freely given, and accepting it does not automatically mean exploitation. If expectations are unclear, ask. If gifts later become leverage, name the pressure and set a boundary. Neither person owes intimacy, money management or emotional caretaking because of a purchase.","badgeEn":"Clarity over assumptions","titleRu":"Не додумывай скрытые условия","bodyRu":"Щедрый жест может быть искренним подарком, а его принятие само по себе не означает, что человека используют. Если ожидания неясны — спроси прямо. Если подарок позже превращают в рычаг давления, назови это и обозначь границу. Ни один из вас не обязан давать близость, управлять чужими финансами или становиться психологом из-за покупки.","badgeRu":"Ясность вместо догадок"}}}}}];
  FAMILY_STORY_PACK.forEach(function (story) { EXTRA_STORYLINES[story.id] = story; });

  var personalStorylines = loadPersonalMap();
  var ALL_STORYLINES = Object.assign({}, BUILTIN_STORYLINES, EXTRA_STORYLINES, personalStorylines);

  /* =========================================================================
     3. APPLICATION STATE (RICH DEFAULT VIEW)
     ========================================================================= */
  var state = {
    lang: 'ru',
    storyId: 'couples',
    role: 'A',
    sceneId: 'a1',
    history: [],
    stats: Object.assign({}, INITIAL_STATS),
    lastDeltas: { closeness: 0, intimacy: 0, coercion: 0, ownership: 0, karma: 0 },
    inspectorStat: 'ownership',
    pendingChoice: null,
    guessedType: null,
    bonusPoints: 0,
    unlockedIds: ARCHIVE_MODULES.map(function (m) { return m.id; }), // All 20 theory modules open & readable immediately!
    endingsReached: [],
    activeDeckTab: 'theory', // 'theory' | 'dynamics' | 'directory' | 'ledger'
    theorySearch: '',
    theoryTagFilter: 'ALL',
    selectedDynamicId: 'clean_boundary',
    patternSearch: '',
    patternCat: 'ALL',
    patternOpen: '',
    storyFilter: 'ALL'
  };

  var STAT_BOUNDS = {
    closeness: [0, 100], intimacy: [0, 100], coercion: [0, 100],
    ownership: [0, 100], karma: [-50, 50]
  };

  function clampStat(key, value) {
    var bounds = STAT_BOUNDS[key] || [0, 100];
    var n = Number(value);
    if (!Number.isFinite(n)) n = INITIAL_STATS[key] || 0;
    return Math.max(bounds[0], Math.min(bounds[1], n));
  }

  function saveAppState() {
    try {
      var snapshot = {
        lang: state.lang, storyId: state.storyId, role: state.role,
        sceneId: state.sceneId, history: state.history, stats: state.stats,
        lastDeltas: state.lastDeltas, inspectorStat: state.inspectorStat,
        bonusPoints: state.bonusPoints, unlockedIds: state.unlockedIds,
        endingsReached: state.endingsReached, activeDeckTab: state.activeDeckTab,
        theorySearch: state.theorySearch, theoryTagFilter: state.theoryTagFilter,
        selectedDynamicId: state.selectedDynamicId, storyFilter: state.storyFilter,
        patternSearch: state.patternSearch, patternCat: state.patternCat, patternOpen: state.patternOpen
      };
      localStorage.setItem(STATE_KEY, JSON.stringify(snapshot));
    } catch (e) { /* Storage may be unavailable or full; the session remains usable. */ }
  }

  function restoreAppState() {
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return;
      if (saved.lang === 'en' || saved.lang === 'ru') state.lang = saved.lang;
      if (saved.storyId && ALL_STORYLINES[saved.storyId]) state.storyId = saved.storyId;
      state.role = saved.role === 'B' ? 'B' : 'A';
      var tree = getTree(state.storyId, state.role);
      if (saved.sceneId && (tree.scenes[saved.sceneId] || tree.endings[saved.sceneId])) state.sceneId = saved.sceneId;
      if (saved.stats && typeof saved.stats === 'object') STAT_KEYS.forEach(function(k) { state.stats[k] = clampStat(k, saved.stats[k]); });
      if (saved.lastDeltas && typeof saved.lastDeltas === 'object') STAT_KEYS.forEach(function(k) { state.lastDeltas[k] = clampStat(k, saved.lastDeltas[k] + (k === 'karma' ? 50 : 0)) - (k === 'karma' ? 50 : 0); });
      if (Array.isArray(saved.history)) state.history = saved.history.filter(function(item) {
        if (typeof item === 'string') return Boolean(tree.scenes[item] || tree.endings[item]);
        return Boolean(item && typeof item === 'object' && typeof item.sceneId === 'string' && tree.scenes[item.sceneId] && item.stats && item.lastDeltas);
      }).map(function(item) {
        if (typeof item === 'string') return item;
        var cleanStats = {}, cleanDeltas = {};
        STAT_KEYS.forEach(function(k) { cleanStats[k] = clampStat(k, item.stats[k]); cleanDeltas[k] = Number(item.lastDeltas[k]) || 0; });
        return { sceneId:item.sceneId, stats:cleanStats, lastDeltas:cleanDeltas, bonusPoints:Number(item.bonusPoints) || 0, endingsReached:Array.isArray(item.endingsReached) ? item.endingsReached.slice(-100) : [] };
      });
      if (Number.isFinite(saved.bonusPoints)) state.bonusPoints = Math.max(0, saved.bonusPoints);
      if (Array.isArray(saved.endingsReached)) state.endingsReached = saved.endingsReached.slice(-100);
      ['activeDeckTab','theorySearch','theoryTagFilter','selectedDynamicId','storyFilter','inspectorStat','patternSearch','patternCat','patternOpen'].forEach(function(k) { if (typeof saved[k] === 'string') state[k] = saved[k]; });
    } catch (e) { /* Ignore corrupt or unavailable saved state. */ }
  }

  restoreAppState();

  function getStory(id) {
    return ALL_STORYLINES[id] || ALL_STORYLINES.couples;
  }

  function getTree(storyId, role) {
    var st = getStory(storyId);
    var r = role === 'B' ? 'B' : 'A';
    return (st.roleTrees && st.roleTrees[r]) || st.roleTrees.A;
  }

  function selectStory(storyId, role) {
    var st = getStory(storyId);
    var r = role === 'B' ? 'B' : 'A';
    var tree = getTree(storyId, r);
    state.storyId = storyId;
    state.role = r;
    state.sceneId = tree.startSceneId;
    state.history = [];
    state.pendingChoice = null;
    state.guessedType = null;
    render();
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =========================================================================
     4. INTERACTION HANDLERS
     ========================================================================= */
  function captureUndoSnapshot() {
    return {
      sceneId: state.sceneId,
      stats: Object.assign({}, state.stats),
      lastDeltas: Object.assign({}, state.lastDeltas),
      bonusPoints: state.bonusPoints,
      endingsReached: state.endingsReached.slice()
    };
  }

  window.setLang = function (lang) {
    state.lang = lang === 'en' ? 'en' : 'ru';
    render();
  };

  window.selectStoryHandler = function (sid) {
    selectStory(sid, state.role);
  };

  window.setRoleHandler = function (r) {
    selectStory(state.storyId, r);
  };

  window.selectStatInspector = function (k) {
    if (STAT_META[k]) {
      state.inspectorStat = k;
      render();
    }
  };

  window.pickChoiceHandler = function (choiceId) {
    var tree = getTree(state.storyId, state.role);
    var scene = tree.scenes[state.sceneId];
    if (!scene || !scene.choices) return;
    var ch = scene.choices.find(function (c) { return c.id === choiceId; });
    if (!ch) return;

    state.history.push(captureUndoSnapshot());
    var d = ch.deltas || {};
    STAT_KEYS.forEach(function (k) {
      var delta = Number(d[k]) || 0;
      state.lastDeltas[k] = delta;
      state.stats[k] = clampStat(k, state.stats[k] + delta);
    });

    state.pendingChoice = ch;
    state.guessedType = null;
    render();
  };

  window.guessDynamicHandler = function (typeId) {
    if (!state.pendingChoice || state.guessedType) return;
    state.guessedType = typeId;
    if (typeId === (state.pendingChoice.dynamicType || state.pendingChoice.dynamicId)) {
      state.bonusPoints += 10;
    }
    render();
  };

  window.advanceChoiceHandler = function () {
    if (!state.pendingChoice) return;
    var ch = state.pendingChoice;
    state.sceneId = ch.nextSceneId;
    state.pendingChoice = null;
    state.guessedType = null;

    var tree = getTree(state.storyId, state.role);
    var endObj = tree.endings[state.sceneId];
    if (endObj) {
      var recKey = state.storyId + ':' + state.role + ':' + state.sceneId;
      if (!state.endingsReached.some(function (x) { return x.key === recKey; })) {
        state.endingsReached.push({
          key: recKey,
          storyId: state.storyId,
          role: state.role,
          tone: endObj.tone,
          titleEn: endObj.titleEn,
          titleRu: endObj.titleRu
        });
      }
    }
    render();
  };

  window.stepBackHandler = function () {
    if (state.history.length > 0) {
      var previous = state.history.pop();
      if (typeof previous === 'string') {
        state.sceneId = previous; // Backward compatibility with older saved sessions.
      } else if (previous && typeof previous === 'object') {
        state.sceneId = previous.sceneId;
        state.stats = Object.assign({}, previous.stats);
        state.lastDeltas = Object.assign({}, previous.lastDeltas);
        state.bonusPoints = previous.bonusPoints;
        state.endingsReached = previous.endingsReached.slice();
      }
      state.pendingChoice = null;
      state.guessedType = null;
      render();
    } else if (state.pendingChoice) {
      state.pendingChoice = null;
      state.guessedType = null;
      render();
    }
  };

  window.setDeckTab = function (tab) {
    state.activeDeckTab = tab;
    render();
  };

  window.setTheoryTag = function (tag) {

    render();

    if (id === 'importModal' && typeof localizeImportModal === 'function') localizeImportModal();

  function parseCsvRows(text) {
    var rows = [], row = [], field = '', quoted = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i], next = text[i + 1];
      if (ch === '"' && quoted && next === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = !quoted;
      else if (ch === ',' && !quoted) { row.push(field); field = ''; }
      else if ((ch === '\n' || ch === '\r') && !quoted) {
        if (ch === '\r' && next === '\n') i++;
        row.push(field); field = '';
        if (row.some(function(v) { return v.trim() !== ''; })) rows.push(row);
        row = [];
      } else field += ch;
    }
    row.push(field);
    if (row.some(function(v) { return v.trim() !== ''; })) rows.push(row);
    if (!rows.length) throw new Error('CSV is empty.');
    var headers = rows.shift().map(function(h) { return h.trim(); });
    return rows.map(function(cols) {
      var obj = {}; headers.forEach(function(h, idx) { obj[h] = (cols[idx] || '').trim(); }); return obj;
    });
  }

      if (!groups[id]) groups[id] = { id:id, title:{en:row.story_title_en || id, ru:row.story_title_ru || id}, context:{en:'',ru:''}, nodes:{} };
      var g = groups[id], nodeId = row.scene_id;
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(nodeId || '')) throw new Error('Invalid scene_id in CSV.');
      if (!g.nodes[nodeId]) g.nodes[nodeId] = { node_id:nodeId, speaker:{en:row.title_en || nodeId,ru:row.title_ru || nodeId}, narrative:{en:row.body_en || '',ru:row.body_ru || ''}, somatic_cue:{en:row.somatic_en || '',ru:row.somatic_ru || ''}, choices:[], ending_type: row.row_type === 'ending' ? (row.ending_tone === 'coercive' ? 'bad' : row.ending_tone === 'safe' ? 'good' : 'mixed') : null };
      var node = g.nodes[nodeId];

    if (!sIds.length) errors.push(p + t7('has no scenes.', 'нет ни одной сцены.'));
    if (!eIds.length) warnings.push(p + t7('has no endings.', 'нет концовок.'));
    sIds.concat(eIds).forEach(function (k) {
      if (!ID_RE.test(k)) errors.push(p + t7('ID “' + shortId(k) + '” has unsafe characters (use letters, numbers, _ or -).', 'идентификатор «' + shortId(k) + '» содержит недопустимые символы (допустимы буквы, цифры, _ и -).'));

      errors.push(p + t7('start scene “' + shortId(tree.startSceneId) + '” is not one of the scenes.', 'стартовая сцена «' + shortId(tree.startSceneId) + '» не найдена среди сцен.'));
    }
    sIds.forEach(function (sid) {
      var sc = tree.scenes[sid];
      if (!isPlainObj(sc)) { errors.push(p + t7('scene “' + shortId(sid) + '” is not an object.', 'сцена «' + shortId(sid) + '» должна быть объектом.')); return; }
      if (!hasText(sc, 'bodyEn', 'bodyRu')) errors.push(p + t7('scene “' + shortId(sid) + '” has no text (bodyEn / bodyRu).', 'в сцене «' + shortId(sid) + '» нет текста (bodyEn / bodyRu).'));
      if (!Array.isArray(sc.choices) || !sc.choices.length) {
        errors.push(p + t7('scene “' + shortId(sid) + '” has no choices, so the player would be stuck.', 'в сцене «' + shortId(sid) + '» нет вариантов выбора — игрок застрянет.'));
        return;
      }
      var seen = {};
      sc.choices.forEach(function (c, i) {
        var where = p + t7('scene “' + shortId(sid) + '”, choice ' + (i + 1) + ': ', 'сцена «' + shortId(sid) + '», выбор ' + (i + 1) + ': ');
        if (!isPlainObj(c)) { errors.push(where + t7('not an object.', 'должен быть объектом.')); return; }
        if (typeof c.id !== 'string' || !ID_RE.test(c.id)) errors.push(where + t7('missing or unsafe id.', 'нет id или он содержит недопустимые символы.'));
        else if (HAS.call(seen, c.id)) errors.push(where + t7('duplicate choice id “' + shortId(c.id) + '”.', 'повторяется id «' + shortId(c.id) + '».'));
        else seen[c.id] = 1;
        if (!hasText(c, 'labelEn', 'labelRu')) errors.push(where + t7('missing label (labelEn / labelRu).', 'нет текста (labelEn / labelRu).'));
        if (typeof c.nextSceneId !== 'string' || !(HAS.call(tree.scenes, c.nextSceneId) || HAS.call(tree.endings, c.nextSceneId))) {
          errors.push(where + t7('leads to “' + shortId(c.nextSceneId) + '”, which does not exist.', 'ведёт к «' + shortId(c.nextSceneId) + '», такой сцены или концовки нет.'));
        }
