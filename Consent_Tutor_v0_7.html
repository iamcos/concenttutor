<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Consent Tutor · Практикум по согласию — версия 0.7 (RU / EN)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131822;
      --surface-2: #1a2130;
      --surface-3: #222b3d;
      --border: #2b3548;
      --text: #eef2f8;
      --muted: #98a4b8;
      --accent: #5eead4;
      --accent-dim: rgba(94, 234, 212, 0.14);
      --warn: #fbbf24;
      --danger: #f87171;
      --safe: #4ade80;
      --purple: #c084fc;
      --blue: #38bdf8;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0 0 64px 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 14px 40px;
    }

    /* Top Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    button {
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 7px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
    }

    button:hover:not(:disabled) { border-color: #475569; background: var(--surface-3); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #071311;
      border-color: var(--accent);
      font-weight: 700;
    }
    button.primary:hover:not(:disabled) { background: #7ef3e0; }

    button.danger {
      background: rgba(248, 113, 113, 0.15);
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.45);
    }

    button.active-pill {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
    }
    .lang-switch button {
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 6px 10px;
      font-size: 0.78rem;
    }
    .lang-switch button.active-lang {
      background: var(--accent);
      color: #071311;
      font-weight: 800;
    }

    /* Telemetry Strip */
    .telemetry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .stat-tile {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 10px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .stat-tile.selected {
      border-color: var(--accent);
      background: rgba(94, 234, 212, 0.08);
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .stat-bar {
      height: 5px;
      border-radius: 999px;
      background: var(--bg);
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .delta-pos { color: var(--safe); font-size: 0.75rem; font-weight: 700; }
    .delta-neg { color: var(--danger); font-size: 0.75rem; font-weight: 700; }

    .inspector-inline {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.84rem;
    }

    /* Main Responsive Split Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 960px) {
      .main-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
    }

    /* Story Selector Ribbon */
    .story-ribbon {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      scrollbar-width: thin;
    }
    .story-chip {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .story-chip.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge.safe { color: var(--safe); border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.1); }
    .badge.coercive { color: var(--danger); border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.1); }
    .badge.accent { color: var(--accent); border-color: rgba(94, 234, 212, 0.4); background: var(--accent-dim); }
    .badge.warn { color: var(--warn); border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.1); }

    .scene-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
    }

    .somatic-box {
      background: rgba(251, 191, 36, 0.08);
      border-left: 3px solid var(--warn);
      padding: 10px 12px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.88rem;
    }
    .somatic-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--warn);
      display: block;
      margin-bottom: 2px;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 12px;
    }
    .choice-btn {
      width: 100%;
      text-align: left;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 13px;
      background: var(--surface-2);
      line-height: 1.4;
    }
    .choice-btn:hover {
      border-color: var(--accent);
      background: var(--surface-3);
    }
    .choice-sub {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 400;
    }

    .post-choice-box {
      background: rgba(94, 234, 212, 0.07);
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 12px;
      padding: 13px;
      margin-top: 12px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    .dyn-chip {
      font-size: 0.76rem;
      padding: 5px 9px;
      border-radius: 999px;
    }
    .dyn-chip.correct {
      background: rgba(74, 222, 128, 0.18);
      border-color: var(--safe);
      color: #bbf7d0;
    }
    .dyn-chip.wrong {
      background: rgba(248, 113, 113, 0.18);
      border-color: var(--danger);
      color: #fecaca;
    }

    /* Knowledge & Theory Deck (Right Column) */
    .deck-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .deck-tab {
      flex: 1 1 auto;
      justify-content: center;
      font-size: 0.79rem;
      padding: 8px 10px;
    }
    .deck-tab.active {
      background: var(--accent);
      color: #071311;
      border-color: var(--accent);
      font-weight: 800;
    }

    .theory-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 760px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .theory-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
    }
    .theory-card.unlocked {
      border-left: 3px solid var(--accent);
    }
    .theory-card h4 {
      margin: 4px 0 4px;
      font-size: 0.92rem;
    }
    .theory-card p {
      margin: 0;
      font-size: 0.83rem;
      color: #d6deeb;
    }

    .story-dir-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      margin-bottom: 8px;
    }
    .story-dir-item.current {
      border-color: var(--accent);
    }

    .resources-box {
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 11px;
      padding: 11px 13px;
      margin-top: 12px;
      font-size: 0.83rem;
    }

    .board-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    @media (min-width: 600px) {
      .board-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .board-cell {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 0.8rem;
    }
    .board-cell strong {
      display: block;
      color: var(--accent);
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    /* Modals & Decoy */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 640px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      font-family: var(--font);
      font-size: 0.84rem;
      margin: 5px 0 9px;
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; min-height: 120px; }

    .decoy-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2500;
      background: #f8fafc;
      color: #0f172a;
      padding: 28px 20px;
      font-family: Georgia, serif;
    }
    .decoy-screen.active { display: block; }
    .muted { color: var(--muted); font-size: 0.82rem; }

    /* Mobile-first refinements: safe areas, readable controls, no clipped panels. */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { min-width: 0; min-height: 100dvh; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .shell { width: 100%; min-width: 0; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .topbar, .top-actions, .brand, .card, .telemetry-card, .main-grid, .scene-box, .post-choice-box { min-width: 0; }
    .top-actions { flex-wrap: wrap; }
    button { min-height: 40px; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .story-ribbon, .chip-row, .deck-tabs { overscroll-behavior-x: contain; }
    .theory-list { max-height: min(760px, 70dvh); }
    .modal-backdrop { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); align-items: flex-end; }
    .modal-card { max-height: min(92dvh, 900px); border-radius: 16px 16px 10px 10px; padding: 14px; overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      .shell { padding-top: 8px; padding-bottom: 20px; }
      .topbar { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
      .brand h1 { font-size: 1.02rem; }
      .brand p { font-size: 0.72rem; line-height: 1.35; }
      .top-actions { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; width: 100%; }
      .top-actions > button { justify-content: center; padding: 8px 7px; font-size: 0.74rem; min-width: 0; }
      .lang-switch button { min-height: 40px; padding: 6px 9px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .stat-tile { padding: 8px; min-width: 0; }
      .stat-top { align-items: flex-start; gap: 4px; font-size: 0.66rem; }
      .stat-top > span:first-child { overflow-wrap: anywhere; }
      .stat-val { font-size: 1.05rem; }
      .telemetry-card, .card { padding: 10px; border-radius: 12px; }
      .main-grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .scene-box { padding: 12px; }
      .scene-box p { font-size: 0.92rem !important; line-height: 1.55; overflow-wrap: anywhere; }
      .choice-btn { min-height: 48px; padding: 12px; }
      .choice-btn > span:first-child { overflow-wrap: anywhere; }
      .deck-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .deck-tab { min-width: 0; min-height: 44px; padding: 8px 6px; }
      .board-grid { grid-template-columns: minmax(0, 1fr); }
      .inspector-inline { line-height: 1.45; }
      .story-chip { min-height: 40px; }
      .badge-row { row-gap: 5px; }
      .resources-box { overflow-wrap: anywhere; }
      input[type="text"], input[type="password"], textarea, select { font-size: 16px; }
    }
    @media (max-width: 380px) {
      .top-actions { grid-template-columns: 1fr 1fr; }
      .lang-switch { grid-column: 1 / -1; justify-self: start; }
      .stats-grid { grid-template-columns: minmax(0, 1fr); }
      .stat-tile { display: grid; grid-template-columns: 1fr auto; align-items: center; }
      .stat-bar { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ===== v0.7 additions ===== */
    .btn-lg { min-height: 48px; font-size: 1rem; padding: 10px 16px; }
    .file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    .imp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .imp-head h3 { margin: 0; }
    .imp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
    .imp-actions-end { position: sticky; bottom: -14px; background: var(--surface); padding: 8px 0; margin-bottom: 0; }
    .imp-filename { overflow-wrap: anywhere; font-size: 0.82rem; }
    .imp-label { display: block; margin: 12px 0 4px; font-size: 0.84rem; color: var(--muted); }
    #importPasteArea { width: 100%; min-height: 96px; max-height: 200px; resize: vertical; box-sizing: border-box; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; }
    .imp-summary { margin: 12px 0 6px; font-size: 0.84rem; color: var(--muted); }
    .imp-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 10px 12px; margin-bottom: 8px; }
    .imp-item.imp-new { border-left: 3px solid var(--safe); }
    .imp-item.imp-replace { border-left: 3px solid var(--warn); }
    .imp-item.imp-invalid { border-left: 3px solid var(--danger); }
    .imp-item.imp-builtin { border-left: 3px solid var(--muted); }
    .imp-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .imp-id { font-size: 0.78rem; margin-top: 2px; overflow-wrap: anywhere; }
    .imp-err { color: #fecaca; font-size: 0.82rem; margin-top: 4px; overflow-wrap: anywhere; }
    .imp-warn { color: #fde68a; font-size: 0.8rem; margin-top: 4px; overflow-wrap: anywhere; }
    .imp-check { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 36px; font-size: 0.88rem; }
    .imp-check input { width: 20px; height: 20px; }
    .imp-status { margin-top: 8px; font-size: 0.86rem; min-height: 1.2em; overflow-wrap: anywhere; }
    .imp-status.ok { color: var(--safe); }
    .imp-status.err { color: #fecaca; }
    .imp-more { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
    .imp-more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
    .imp-more-body { display: flex; flex-direction: column; gap: 8px; }
    .imp-more-body input[type=text] { width: 100%; box-sizing: border-box; }
    .imp-remove { margin-top: 8px; font-size: 0.8rem; }
    .dir-head { margin-bottom: 12px; }
    .dir-head p { margin: 6px 0 0; }
    .pattern-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .pattern-card { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; text-align: left; width: 100%; min-height: 56px; padding: 11px 12px; border-left: 3px solid var(--accent); }
    .pattern-card strong { font-size: 0.95rem; }
    .pattern-hint { font-size: 0.82rem; color: #d6deeb; font-weight: 400; }
    .pat-back { margin-bottom: 8px; min-height: 44px; }
    .pat-title { margin: 4px 0 6px; font-size: 1.2rem; }
    .pat-lead { margin: 0 0 8px; font-size: 0.95rem; color: #e6edf7; line-height: 1.5; }
    .pat-sec { margin-top: 14px; }
    .pat-sec h4 { margin: 0 0 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .pat-sec p { margin: 0; font-size: 0.9rem; line-height: 1.55; color: #d6deeb; }
    .pat-list { margin: 0; padding-left: 18px; font-size: 0.9rem; line-height: 1.55; color: #d6deeb; }
    .pat-quote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--purple); background: var(--surface-2); border-radius: 8px; font-size: 0.9rem; font-style: italic; color: #e6edf7; }
    .pat-story { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 0.88rem; }
    .pat-story span { flex: 1 1 100%; font-weight: 600; }
    .pat-note { margin-top: 12px; font-size: 0.8rem; }
    .pat-intro { margin: 0 0 8px; }
    input[type=search] { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

<div id="decoyScreen" class="decoy-screen">
  <div id="decoyContent" style="max-width:680px;margin:0 auto;"></div>
</div>

<div class="shell" id="appRoot">
  <noscript>
    <div style="padding:20px;background:#1a2130;color:#fff;border-radius:12px;">
      JavaScript is required to run Consent Tutor.
    </div>
  </noscript>
</div>

<!-- Import / Export Modal (v0.7) -->
<div class="modal-backdrop" id="importModal" role="dialog" aria-modal="true" aria-labelledby="impTitle">
  <div class="modal-card">
    <div class="imp-head">
      <h3 id="impTitle">Add story pack</h3>
      <button type="button" onclick="closeModal('importModal')" aria-label="Close">✕</button>
    </div>
    <p class="muted" id="impDesc"></p>
    <div class="imp-actions">
      <button type="button" class="primary btn-lg" id="impChooseBtn" onclick="chooseJsonFile()">Choose JSON file</button>
      <span id="impFileName" class="muted imp-filename"></span>
    </div>
    <input type="file" id="importFileInput" class="file-hidden" accept=".json,.csv,application/json,text/csv" onchange="handleImportFile(event)" tabindex="-1" aria-hidden="true" />
    <label for="importPasteArea" id="impPasteLabel" class="imp-label"></label>

, "ru": {"signs": ["Вздохи, обиженное молчание или «после всего, что я для тебя делаю» — чтобы сдвинуть решение", "Срочность, которой раньше не было («ответь прямо сейчас»)", "Разочарование подаётся как вина другого", "После отказа появляется скрытая цена: холодность, демонстративная обида"], "example": "«Ладно. Забудь. Я думал(а), что тебе это важно, но, видимо, ошибся(лась)».", "begins": "Часто как обычное разочарование. Паттерном это становится, когда чувство используют, чтобы получить «да».", "escalates": "Если это работает, просьбы растут, а сопротивление встречают новой виной, срочностью или лишением тепла.", "feels": "Напряжение и спешка, ощущение ответственности за настроение другого, согласие ради того, чтобы дискомфорт прекратился.", "notSame": "Любой человек может обидеться и сказать об этом. Разница в том, остаётся ли «нет» безопасным и признаёт ли человек чувство своим или использует его как рычаг.", "alt": "Спокойно назовите давление («мне нужно время подумать») и отвечайте, когда будете готовы. Если расстроены вы, скажите об этом, не привязывая к этому цену.", "reflect": ["Где в теле вы замечаете желание быстро согласиться?", "Если вы сами когда-то так делали, что вам было нужно в тот момент?"]}}, "moving_goalposts": {"cat": "control", "theory": ["m06", "m14"], "related": ["soft_pressure", "possessive_claim", "dismissal"], "en": {"signs": ["Agreed conditions are met and a new condition appears", "Standards change without notice", "Effort is never “enough”", "Affection or approval is promised for the next step"], "example": "“Yes, you were home on time. But you could have texted earlier. Try harder next time.”", "begins": "With reasonable requests. The bar rises a little at a time, so each step looks small.", "escalates": "Rules multiply and become less predictable, leaving the person constantly adjusting to avoid disapproval.", "feels": "Confusion, exhaustion and self-doubt; trying harder without ever arriving.", "notSame": "Agreements can change in healthy relationships — openly, together and with notice. The warning sign is changes made alone that make success impossible.", "alt": "Write the agreement down together, notice whether the target keeps moving, and renegotiate openly.", "reflect": ["Which expectation has changed most since you started?", "What would “done” look like to you?"]}, "ru": {"signs": ["Договорённые условия выполнены, и появляется новое условие", "Требования меняются без предупреждения", "Усилий никогда «недостаточно»", "Тепло или одобрение обещают за следующий шаг"], "example": "«Да, ты пришёл вовремя. Но мог бы написать раньше. В следующий раз постарайся лучше».", "begins": "С разумных просьб. Планка поднимается понемногу, поэтому каждый шаг выглядит небольшим.", "escalates": "Правил становится больше, они менее предсказуемы, и человек постоянно подстраивается, чтобы избежать недовольства.", "feels": "Растерянность, усталость и сомнение в себе; стараешься сильнее, но так и не «приходишь».", "notSame": "В здоровых отношениях договорённости тоже меняются — открыто, вместе и с предупреждением. Тревожный признак — изменения в одиночку, из-за которых успех становится невозможным.", "alt": "Запишите договорённость вместе, замечайте, не уходит ли цель всё дальше, и пересматривайте её открыто.", "reflect": ["Какое ожидание изменилось сильнее всего с начала отношений?", "Как для вас выглядело бы «достаточно»?"]}}, "honest_repair": {"cat": "repair", "theory": ["m07", "m23", "m26"], "related": ["clean_boundary", "curious_check_in", "ordinary_conflict"], "en": {"signs": ["Names the specific behaviour, not just “I’m sorry you feel that way”", "Acknowledges the impact", "No blame-shifting and no conditions", "Accepts consequences and shows change over time"], "example": "“I raised my voice and called you selfish. That was not okay. When I’m angry I’ll take a break. You don’t have to forgive me today.”", "begins": "After a moment of harm, when the person chooses to look at what they did instead of defending.", "escalates": "Repair fails when it repeats without change. An apology alone is not evidence of change.", "feels": "Relief and wariness together. Trust returns through repeated, consistent behaviour, not through a single speech.", "notSame": "Repair after an occasional slip is different from apologies that cycle with repeated harm and are used to restore access.", "alt": "Pair the apology with a concrete change and let the other person set the pace of trust.", "reflect": ["What would a specific, non-defensive apology include?", "How would you know a change was real after months, not days?"]}, "ru": {"signs": ["Называет конкретное поведение, а не просто «извини, что ты так это воспринял(а)»", "Признаёт последствия", "Не перекладывает вину и не ставит условий", "Принимает последствия и показывает перемены со временем"], "example": "«Я повысил(а) голос и назвал(а) тебя эгоистом. Это было неправильно. Когда злюсь, я буду делать паузу. Ты не обязан(а) прощать меня сегодня».", "begins": "После момента, когда был причинён вред, если человек выбирает разобраться в том, что сделал, а не защищаться.", "escalates": "Восстановление не работает, если повторяется без изменений. Одно извинение не доказывает, что человек изменился.", "feels": "Облегчение и настороженность одновременно. Доверие возвращается через повторяющееся устойчивое поведение, а не через одну речь.", "notSame": "Восстановление после редкого срыва отличается от извинений, которые чередуются с повторяющимся вредом и служат возвращению доступа.", "alt": "Сочетайте извинение с конкретным изменением и позвольте другому человеку самому определять темп доверия.", "reflect": ["Что входило бы в конкретное извинение без самозащиты?", "Как вы поняли бы, что перемена настоящая, через месяцы, а не через дни?"]}}, "possessive_claim": {"cat": "control", "theory": ["m08", "m14"], "related": ["surveillance", "moving_goalposts", "intimidation"], "en": {"signs": ["Treats a partner’s time, friends or body as owed", "Jealousy turns into rules instead of a conversation", "Frames control as love (“I only do it because I care”)", "Punishes independence or other relationships"], "example": "“If you really loved me you wouldn’t need to see them. I’m the only one who understands you.”", "begins": "Often with intense attention that feels like devotion, followed by narrowing “exceptions” around other relationships.", "escalates": "Isolation from friends and family, monitoring, ultimatums and consequences for independence.", "feels": "Flattering at first, then restrictive, with guilt for wanting your own life.", "notSame": "Jealousy is a common feeling. The concern is behaviour: demands, restrictions and retaliation. Feeling jealous and talking about it is different from forbidding contact.", "alt": "Name the feeling and the need (“I felt anxious and would like reassurance”), ask instead of demanding, and accept the answer.", "reflect": ["What is the difference between wanting closeness and claiming access?", "Which friendships have changed since the relationship began?"]}, "ru": {"signs": ["Считает время, друзей или тело партнёра «своими по праву»", "Ревность превращается в правила вместо разговора", "Контроль подаётся как любовь («я делаю это только потому, что мне не всё равно»)", "Наказывает за самостоятельность и другие отношения"], "example": "«Если бы ты меня правда любил(а), тебе не нужно было бы с ними видеться. Только я тебя понимаю».", "begins": "Часто с интенсивного внимания, которое похоже на преданность, а затем появляются «исключения», сужающие другие отношения.", "escalates": "Изоляция от друзей и семьи, наблюдение, ультиматумы и последствия за самостоятельность.", "feels": "Сначала лестно, потом тесно, а желание иметь собственную жизнь вызывает вину.", "notSame": "Ревность — частое чувство. Тревожит поведение: требования, запреты и ответные меры. Ревновать и говорить об этом — не то же самое, что запрещать общение.", "alt": "Назовите чувство и потребность («мне было тревожно, мне хотелось бы услышать поддержку»), просите, а не требуйте, и принимайте ответ.", "reflect": ["В чём разница между желанием близости и притязанием на доступ?", "Какие дружеские связи изменились с начала отношений?"]}}, "curious_check_in": {"cat": "comm", "theory": ["m21", "m18", "m17"], "related": ["clean_boundary", "honest_repair", "ordinary_conflict"], "en": {"signs": ["Open questions about what the other person wants", "Explicit room for “no”", "Listening without rehearsing a reply", "Checking understanding before deciding"], "example": "“What matters most to you about this plan? If you’d rather not, that’s okay — I’d like to understand.”", "begins": "At the point where a person chooses curiosity over assumption.", "escalates": "It does not escalate. Overused during a crisis without action, it can feel indecisive.", "feels": "Lower urgency; sometimes uncomfortable if you are used to guessing or hiding your preferences.", "notSame": "A check-in is a real question. Interrogating, testing loyalty or asking in order to build a case is something else.", "alt": "Pair the question with your own need so the exchange is not one-sided.", "reflect": ["Which question could you ask this week that leaves room for “no”?", "What stops you from asking?"]}, "ru": {"signs": ["Открытые вопросы о том, чего хочет другой человек", "Явно оставленное место для «нет»", "Слушает, не заготавливая ответ", "Проверяет, правильно ли понял, прежде чем решать"], "example": "«Что для тебя важно в этом плане? Если не хочешь, ничего страшного — я хочу понять».", "begins": "В тот момент, когда человек выбирает любопытство вместо догадок.", "escalates": "Не эскалируется. Если слишком много спрашивать в кризисе и ничего не делать, это может выглядеть нерешительностью.", "feels": "Срочность снижается; иногда неловко, если вы привыкли угадывать или скрывать желания.", "notSame": "Сверка — это настоящий вопрос. Допрос, проверка на верность или вопросы, чтобы собрать обвинения, — это другое.", "alt": "Сочетайте вопрос с собственной потребностью, чтобы разговор не был односторонним.", "reflect": ["Какой вопрос вы могли бы задать на этой неделе, оставив место для «нет»?", "Что мешает вам спрашивать?"]}}, "intimidation": {"cat": "control", "theory": ["m14", "m15"], "related": ["possessive_claim", "surveillance", "moving_goalposts"], "en": {"signs": ["Raised voice, looming, slamming, blocking a doorway", "Threats, explicit or implied, about consequences for refusing", "Destroying or hiding belongings", "Demanding obedience; declaring the discussion closed"], "example": "“You’ll regret it if you walk out. Sit down. We’re not finished until I say so.”", "begins": "Often as “just anger” that is followed by the other person giving in, which teaches that it works.", "escalates": "Threats become more specific, and fear shapes the other person’s choices even when nothing physical happens.", "feels": "Fear, freezing or appeasing; walking on eggshells.", "notSame": "Anger is not automatically intimidation. The questions are whether the other person is afraid to disagree, and whether threats or blocking are used to end the discussion.", "alt": "If you are the one who is angry: pause and step away without blocking anyone. If you are afraid: your safety comes first — consider a trusted person or local support.", "reflect": ["Can each person here say no without fearing the reaction?", "If you are unsure whether it is “bad enough”, what would feel safest to do next?"]}, "ru": {"signs": ["Повышенный голос, нависание, хлопанье дверями, перегораживание выхода", "Угрозы, прямые или скрытые, о последствиях отказа", "Порча или прятанье вещей", "Требование подчинения; обсуждение объявляется законченным"], "example": "«Пожалеешь, если уйдёшь. Сядь. Мы закончим, когда я скажу».", "begins": "Часто как «просто злость», после которой другой уступает, и это учит, что так можно добиться своего.", "escalates": "Угрозы становятся конкретнее, и страх влияет на выбор человека, даже если ничего физического не происходит.", "feels": "Страх, оцепенение или стремление угодить; хождение по тонкому льду.", "notSame": "Злость сама по себе не запугивание. Вопросы такие: боится ли другой человек не согласиться и используются ли угрозы или блокирование, чтобы прекратить разговор.", "alt": "Если злитесь вы: сделайте паузу и отойдите, никого не блокируя. Если вам страшно: на первом месте ваша безопасность — подумайте о близком человеке или местной службе поддержки.", "reflect": ["Может ли здесь каждый сказать «нет», не боясь реакции?", "Если вы не уверены, «достаточно ли это серьёзно», что было бы самым безопасным шагом дальше?"]}}, "surveillance": {"cat": "digital", "theory": ["m12", "m08"], "related": ["possessive_claim", "intimidation", "triangulation"], "en": {"signs": ["Demands for passwords, location sharing or message access", "Checking a phone or using tracking apps", "Reading private conversations as “proof”", "Treating privacy as secrecy or betrayal"], "example": "“Unlock your phone. If you have nothing to hide, it shouldn’t matter.”", "begins": "With “sharing” presented as trust, which then becomes expected and then enforced.", "escalates": "Monitoring widens to contacts, spending and movements, and is used to justify restrictions or accusations.", "feels": "Constantly observed, self-censoring, losing private space.", "notSame": "Transparency that both people choose freely (a shared calendar) differs from monitoring demanded under pressure. For children, age-appropriate safety rules differ from blanket access to every private message.", "alt": "Agree openly on what is shared, for both people, and revisit it. Talk about the worry behind the urge to check.", "reflect": ["Who chose what is shared, and can it change without punishment?", "What worry sits behind the need to check?"]}, "ru": {"signs": ["Требования паролей, геолокации или доступа к сообщениям", "Проверка телефона, приложения для слежения", "Чтение личной переписки как «доказательства»", "Приватность считают скрытностью или предательством"], "example": "«Разблокируй телефон. Если тебе нечего скрывать, какая разница».", "begins": "С «открытости», поданной как доверие, которая затем становится ожидаемой, а потом обязательной.", "escalates": "Наблюдение расширяется на контакты, траты и передвижения и оправдывает ограничения или обвинения.", "feels": "Чувство постоянного наблюдения, самоцензура, потеря личного пространства.", "notSame": "Прозрачность, которую оба выбрали добровольно (общий календарь), отличается от слежки, которой добиваются давлением. Для детей разумные правила безопасности по возрасту отличаются от полного доступа ко всей личной переписке.", "alt": "Открыто договоритесь, чем делитесь оба, и пересматривайте это. Поговорите о тревоге, которая стоит за желанием проверять.", "reflect": ["Кто выбирал, чем делиться, и можно ли это изменить без наказания?", "Какая тревога стоит за желанием проверять?"]}}, "triangulation": {"cat": "manip", "theory": ["m09", "m30"], "related": ["dismissal", "soft_pressure", "surveillance"], "en": {"signs": ["Using a third person (a child, friend or relative) to carry messages or take sides", "Comparing (“Even your sister agrees with me”)", "Asking someone to report on another person", "Recruiting allies against the other person"], "example": "“Tell your father what you told me about him. And let me know what he says afterwards.”", "begins": "Often as seeking support, then drifting into recruiting witnesses or messengers.", "escalates": "More third parties are drawn into the conflict, and the target is isolated or discredited.", "feels": "Caught in the middle, disloyal whichever way you turn, pressured to choose.", "notSame": "Seeking support from friends is healthy. The concern is using others as tools of pressure — especially children, who must not become mediators, messengers or spies.", "alt": "Speak directly with the person concerned, or seek support for yourself without asking anyone to take sides or carry messages.", "reflect": ["Who has been placed in the middle?", "How could that person be freed from the role?"]}, "ru": {"signs": ["Третьего человека (ребёнка, друга, родственника) используют, чтобы передавать сообщения или занимать сторону", "Сравнения («даже твоя сестра со мной согласна»)", "Просьба докладывать о другом человеке", "Набор союзников против другого человека"], "example": "«Скажи отцу то, что ты мне рассказал(а) о нём. А потом сообщи мне, что он ответил».", "begins": "Часто как поиск поддержки, который постепенно превращается в набор свидетелей или посредников.", "escalates": "В конфликт втягивается всё больше людей, а адресат оказывается в изоляции или его репутацию подрывают.", "feels": "Оказываешься посередине, везде «предатель», тебя заставляют выбирать.", "notSame": "Искать поддержку у друзей — нормально. Тревожит использование людей как инструмента давления, особенно детей: они не должны быть посредниками, курьерами или шпионами.", "alt": "Говорите напрямую с тем, кого это касается, или ищите поддержку для себя, не прося никого занимать сторону или передавать сообщения.", "reflect": ["Кого поставили в середину?", "Как освободить этого человека от такой роли?"]}}, "dismissal": {"cat": "manip", "theory": ["m17", "m25"], "related": ["soft_pressure", "triangulation", "moving_goalposts"], "en": {"signs": ["Telling someone they are overreacting or “too sensitive”", "Denying events that happened", "Mocking or minimising concerns", "Changing the subject when a concern is raised"], "example": "“That never happened. You’re making a big deal out of nothing. You always do this.”", "begins": "Often as defensiveness in a hard moment.", "escalates": "Repeated denial can make a person doubt their own memory and perception and stop raising concerns.", "feels": "Confusion, shame, self-doubt and silence.", "notSame": "Two people can remember an event differently. What matters is whether the disagreement is explored with curiosity or repeatedly shut down. One defensive moment is not a pattern.", "alt": "Reflect back what you heard before responding. For yourself, privately noting what happened, if it feels safe to do so, can help you trust your own perception.", "reflect": ["When you raise a concern, what usually happens?", "What do you know about what happened, apart from how it was described to you?"]}, "ru": {"signs": ["Говорят, что человек «слишком остро реагирует» или «слишком чувствителен»", "Отрицают события, которые были", "Высмеивают или преуменьшают тревоги", "Меняют тему, когда поднимается беспокойство"], "example": "«Этого не было. Ты делаешь из мухи слона. Ты всегда так».", "begins": "Часто как защитная реакция в трудный момент.", "escalates": "Повторяющееся отрицание может заставить человека сомневаться в собственной памяти и восприятии и перестать говорить о проблемах.", "feels": "Растерянность, стыд, сомнение в себе и молчание.", "notSame": "Два человека могут по-разному помнить событие. Важно, исследуют ли разногласие с любопытством или раз за разом закрывают тему. Один защитный момент — ещё не паттерн.", "alt": "Прежде чем отвечать, перескажите то, что услышали. Для себя можно тихо записывать, что произошло, если это безопасно, — это помогает доверять собственному восприятию.", "reflect": ["Что обычно происходит, когда вы поднимаете беспокоящий вопрос?", "Что вы знаете о случившемся независимо от того, как это вам описали?"]}}, "ordinary_conflict": {"cat": "comm", "theory": ["m29", "m19"], "related": ["honest_repair", "curious_check_in", "clean_boundary"], "en": {"signs": ["Disagreement with sharp or irritated words, followed by repair", "Both people can say no and be heard", "No fear of retaliation", "Needs for space are respected"], "example": "“I was snappy earlier — sorry. Can we sort out dinner and your plans?”", "begins": "With stress, tiredness or conflicting needs.", "escalates": "Handled well, it ends in repair. A single incident alone is not abuse.", "feels": "Uncomfortable and frustrating, but safe: you can still say what you think.", "notSame": "Ask whether there is repetition, fear, punishment for saying no, or restriction of freedom. If those are absent, it is more likely ordinary conflict.", "alt": "Take a break, name the irritation and return to the practical issue.", "reflect": ["After an argument, can both people disagree without punishment?", "How does repair usually happen here?"]}, "ru": {"signs": ["Разногласие с резкими или раздражёнными словами, после которого происходит примирение", "Оба могут сказать «нет» и быть услышанными", "Нет страха ответных мер", "Потребность в личном пространстве уважается"], "example": "«Я раньше резко ответил(а) — прости. Давай решим вопрос с ужином и твоими планами?»", "begins": "Со стресса, усталости или столкновения потребностей.", "escalates": "Если с ним справляются хорошо, он заканчивается восстановлением контакта. Один эпизод сам по себе не насилие.", "feels": "Неприятно и досадно, но безопасно: вы по-прежнему можете сказать, что думаете.", "notSame": "Спросите себя: есть ли повторяемость, страх, наказание за отказ или ограничение свободы. Если этого нет, скорее всего, это обычный конфликт.", "alt": "Сделайте паузу, назовите раздражение и вернитесь к практическому вопросу.", "reflect": ["Могут ли после ссоры оба человека не соглашаться без наказания?", "Как здесь обычно происходит восстановление?"]}}, "child_self_advocacy": {"cat": "family", "theory": ["m30"], "related": ["clean_boundary", "ordinary_conflict", "triangulation"], "en": {"signs": ["A young person states a plan, feeling or need", "Keeps school, friends and interests", "Asks a trusted adult for support", "Is not made responsible for adult conflict"], "example": "“I’ll be home at six like we agreed. I’m at football practice. Message me if the plan changes.”", "begins": "When a child is given room for a voice and a life beyond family tension.", "escalates": "This is not an escalating pattern. It is protective and should be supported by adults.", "feels": "Sometimes guilt for enjoying life while home feels tense.", "notSame": "A child expressing independence is not being disloyal. Adults, not children, are responsible for adult relationships and for a child’s safety.", "alt": "Adults: keep routines, privacy and age-appropriate trust. Young people: you may ask a trusted adult for help at your own pace.", "reflect": ["Which parts of life belong to the child alone?", "Who is a trusted adult, and how could they be reached?"]}, "ru": {"signs": ["Подросток называет свой план, чувство или потребность", "Сохраняет школу, друзей и интересы", "Просит поддержки у надёжного взрослого", "Не отвечает за конфликты взрослых"], "example": "«Я буду дома к шести, как договаривались. Я на футбольной тренировке. Напиши, если планы изменятся».", "begins": "Когда ребёнку оставляют место для собственного голоса и жизни за пределами семейного напряжения.", "escalates": "Это не нарастающий паттерн. Он защищает, и взрослые должны его поддерживать.", "feels": "Иногда вина за то, что радуешься, пока дома напряжённо.", "notSame": "Самостоятельность ребёнка — не предательство. За отношения взрослых и безопасность ребёнка отвечают взрослые, а не дети.", "alt": "Взрослым: сохранять распорядок, личное пространство и доверие, соответствующее возрасту. Подросткам: можно попросить помощи у надёжного взрослого в своём темпе.", "reflect": ["Какие части жизни принадлежат только ребёнку?", "Кто для вас надёжный взрослый и как с ним связаться?"]}}};
      INTERACTION_TYPES.push.apply(INTERACTION_TYPES, [{"id": "intimidation", "en": {"name": "Intimidation / Threat", "hint": "Uses fear — a raised voice, blocking, threats — to end a disagreement or force compliance.", "structure": "Show of force or threat + demand + consequence for refusing."}, "ru": {"name": "Запугивание / Угроза", "hint": "Использует страх — крик, блокирование пути, угрозы — чтобы прекратить спор или добиться подчинения.", "structure": "Демонстрация силы или угроза + требование + последствие за отказ."}}, {"id": "surveillance", "en": {"name": "Surveillance / Privacy Violation", "hint": "Monitors messages, location or contacts without free consent, and treats privacy as betrayal.", "structure": "Demand for access + “trust” framing + penalty for keeping privacy."}, "ru": {"name": "Слежка / Нарушение приватности", "hint": "Следит за сообщениями, местоположением или контактами без добровольного согласия и считает приватность предательством.", "structure": "Требование доступа + рамка «доверия» + наказание за личное пространство."}}, {"id": "triangulation", "en": {"name": "Triangulation", "hint": "Uses another person as messenger, ally or witness in order to pressure someone.", "structure": "Third person pulled in + sides or reports requested + the target is isolated."}, "ru": {"name": "Втягивание третьих лиц", "hint": "Использует другого человека как посредника, союзника или свидетеля, чтобы давить на кого-то.", "structure": "Втянут третий человек + просьба принять сторону или докладывать + адресат остаётся в изоляции."}}, {"id": "dismissal", "en": {"name": "Dismissal / Invalidation", "hint": "Minimises, mocks or denies another person’s experience or concerns.", "structure": "Concern raised + minimising or denial + subject changed."}, "ru": {"name": "Обесценивание / Отрицание", "hint": "Преуменьшает, высмеивает или отрицает чужой опыт и тревоги.", "structure": "Высказана тревога + преуменьшение или отрицание + смена темы."}}, {"id": "ordinary_conflict", "en": {"name": "Ordinary Conflict", "hint": "A real disagreement with sharp moments, but without fear, punishment or loss of freedom.", "structure": "Disagreement + irritation + pause or repair; both people can say no."}, "ru": {"name": "Обычный конфликт", "hint": "Настоящее разногласие с резкими моментами, но без страха, наказания и потери свободы.", "structure": "Разногласие + раздражение + пауза или восстановление контакта; оба могут отказать."}}, {"id": "child_self_advocacy", "en": {"name": "A Child’s Own Voice", "hint": "A young person states a plan or need and keeps a life beyond adult conflict.", "structure": "Clear update + own interests + support from a trusted adult when needed."}, "ru": {"name": "Собственный голос ребёнка", "hint": "Подросток обозначает план или потребность и сохраняет свою жизнь за пределами конфликта взрослых.", "structure": "Ясное сообщение + собственные интересы + поддержка надёжного взрослого при необходимости."}}]);

      var ARCHIVE_MODULES = [
        { id: 'm01', en: { title: 'Consent vs. Compliance', tag: 'Foundations', body: 'Compliance happens when someone says yes out of relief, fear, or obligation. Consent requires real room to say no without social or emotional penalty.' }, ru: { title: 'Согласие против уступчивости', tag: 'Основы', body: 'Уступчивость возникает из усталости, вины или страха. Согласие существует только там, где есть реальная возможность сказать «нет» без расплаты.' } },
        { id: 'm02', en: { title: 'Somatic Early Warnings', tag: 'Body Cues', body: 'A tight jaw, shallow breath, or sudden urge to over-explain often arrives seconds before your mind labels what feels off.' }, ru: { title: 'Телесные сигналы раннего предупреждения', tag: 'Тело', body: 'Сжатая челюсть, поверхностный вдох или резкое желание всё объяснить часто появляются раньше, чем ум находит слова.' } },
        { id: 'm03', en: { title: 'The Urgency Trap', tag: 'Dynamics', body: '"Decide right now or it\'s over" compresses reflection and pushes people into reactive choices they regret later.' }, ru: { title: 'Ловушка ложной срочности', tag: 'Динамика', body: 'Фраза «решай сейчас или всё кончено» сжимает паузу и толкает к поспешным решениям, о которых жалеют позже.' } },
        { id: 'm04', en: { title: 'Clean Boundaries Without Punishment', tag: 'Boundaries', body: 'A boundary names what you will or won\'t do; it does not need a speech or a cold-war punishment to be real.' }, ru: { title: 'Чистая граница без наказания', tag: 'Границы', body: 'Граница говорит о ваших действиях и пределах — ей не нужны длинные речи или холодная война, чтобы быть живой.' } },
        { id: 'm05', en: { title: 'Fawning as Learned Safety', tag: 'Attachment', body: 'Appeasing or smoothing over tension is often an old survival habit, not a lack of spine.' }, ru: { title: 'Угодничество как старый навык безопасности', tag: 'Привязанность', body: 'Сглаживание углов и уступки часто выучены как способ снизить риск конфликта, а не из-за «слабости».' } },
        { id: 'm06', en: { title: 'Moving Goalposts in Tension', tag: 'Patterns', body: 'When one standard is met and another immediately replaces it, the issue is often control rather than clarity.' }, ru: { title: 'Сдвиг условий в напряжении', tag: 'Паттерны', body: 'Когда одно условие выполнено, но тут же появляется новое, речь часто идёт о контроле, а не о ясности.' } },
        { id: 'm07', en: { title: 'Repair Without Self-Erasure', tag: 'Repair', body: 'Apologizing for a real misstep is healthy; erasing your whole boundary just to keep peace is self-abandonment.' }, ru: { title: 'Восстановление без самостирания', tag: 'Восстановление', body: 'Признать реальный промах здорово, но стирать собственную границу ради тишины — значит предавать себя.' } },
        { id: 'm08', en: { title: 'Possessiveness Disguised as Care', tag: 'Ownership', body: 'Tracking, checking, or demanding instant replies can look like devotion on the surface while restricting freedom underneath.' }, ru: { title: 'Собственнический контроль под маской заботы', tag: 'Контроль', body: 'Постоянные проверки, отчёты или требование мгновенного ответа могут выглядеть как вовлечённость, но ограничивают свободу.' } },
        { id: 'm09', en: { title: 'Co-Parenting Under Strain', tag: 'Family', body: 'When adults clash, kids feel the weather in the room. Clear, low-drama handoffs protect children\'s sense of safety.' }, ru: { title: 'Совместное родительство в напряжении', tag: 'Семья', body: 'Когда взрослые спорят, дети считывают климат в комнате. Спокойная передача дел бережёт их опору.' } },
        { id: 'm10', en: { title: 'Protecting a Child\'s Voice', tag: 'Family', body: 'Children need permission to feel both loyalty and relief without being turned into messengers or referees.' }, ru: { title: 'Бережный голос ребёнка', tag: 'Семья', body: 'Ребёнку важно иметь право чувствовать по-разному и не становиться посредником или судьёй между взрослыми.' } },
        { id: 'm11', en: { title: 'Solitude vs. Loneliness', tag: 'Solitude', body: 'Being alone can recharge autonomy, while loneliness hurts when connection feels out of reach or unreciprocated.' }, ru: { title: 'Одиночество и уединение', tag: 'Одиночество', body: 'Уединение восстанавливает опору на себя, а одиночество болит там, где не хватает живого отклика.' } },
        { id: 'm12', en: { title: 'Secrecy & Hidden Coping', tag: 'Trust', body: 'Secret habits create a double life—hiding behavior takes constant energy and erodes real closeness.' }, ru: { title: 'Скрытность и тайные способы справляться', tag: 'Доверие', body: 'Тайные привычки создают двойную жизнь: удержание тайны отнимает силы и сужает настоящую близость.' } },
        { id: 'm13', en: { title: 'Creative Surge vs. Burnout', tag: 'Rhythm', body: 'Sudden inspiration feels electric, yet ignoring sleep, food, and limits turns a spark into exhaustion.' }, ru: { title: 'Всплеск вдохновения и выгорание', tag: 'Ритм', body: 'Внезапный подъём вдохновения даёт драйв, но без сна и пределов быстро ведёт к истощению.' } },
        { id: 'm14', en: { title: 'Escalation Loops Explained', tag: 'Escalation', body: 'Pressive dynamics rarely jump to day-one extremes; they test small concessions first and widen the margin.' }, ru: { title: 'Как устроены петли эскалации', tag: 'Эскалация', body: 'Давящая динамика редко начинается с крайностей: сначала проверяются малые уступки, затем шаг растёт.' } },
        { id: 'm15', en: { title: 'Why Leaving Early Matters', tag: 'Exits', body: 'Stepping out when subtle disrespect or pressure first shows up saves years of sinking sunk-cost energy.' }, ru: { title: 'Зачем важен ранний выход', tag: 'Выходы', body: 'Уйти при первых явных сигналах давления или неуважения часто экономит годы потраченных сил.' } },
        { id: 'm16', en: { title: 'The Sunk Cost Pull', tag: 'Decisions', body: 'Feeling like you already invested time or hope makes it harder to walk away even when the present cost rises.' }, ru: { title: 'Притяжение невозвратных затрат', tag: 'Решения', body: 'Ощущение уже вложенного времени или надежды мешает уйти, даже когда цена в настоящем растёт.' } },
        { id: 'm17', en: { title: 'Naming Without Diagnosing', tag: 'Clarity', body: 'Describe concrete behaviors and their impact on you rather than slapping labels that spark defensiveness.' }, ru: { title: 'Называть поведение без ярлыков', tag: 'Ясность', body: 'Говорить о конкретных действиях и их влиянии надёжнее, чем навешивать ярлыки, вызывающие защиту.' } },
        { id: 'm18', en: { title: 'Pacing Difficult Talks', tag: 'Regulation', body: 'A high heart rate narrows listening. Taking a named 20-minute break can keep a hard talk constructive.' }, ru: { title: 'Темп сложных разговоров', tag: 'Регуляция', body: 'Учащённый пульс сужает способность слышать. Обозначенная пауза помогает вернуть разговор в рабочее русло.' } },
        { id: 'm19', en: { title: 'Mutual Respect Under Stress', tag: 'Resilience', body: 'Anyone can be easygoing when things are smooth; character shows when plans shift or someone says no.' }, ru: { title: 'Взаимное уважение под нагрузкой', tag: 'Устойчивость', body: 'Быть лёгким легко, когда всё идёт гладко; опора видна, когда планы срываются или звучит «нет».' } },
        { id: 'm20', en: { title: 'Choosing Your Own Exit', tag: 'Agency', body: 'An exit is not a failure—it is an act of self-respect when staying costs your dignity or safety.' }, ru: { title: 'Выбор собственного выхода', tag: 'Субъектность', body: 'Выход из ситуации — не поражение, а шаг самоуважения, когда оставаться значит терять себя или безопасность.' } },
        { id: 'm21', en: { title: 'Accepting No Without Retaliation', tag: 'Consent Skills', body: 'A no can bring disappointment, embarrassment, anger, or fear of rejection. Those feelings are allowed; pressure, punishment, sulking designed to reverse the answer, repeated persuasion, and withdrawal of affection as leverage are not. A respectful response is brief: “Okay. Thanks for telling me.” If needed, take space and regulate yourself without making the other person responsible for soothing you.' }, ru: { title: 'Принимать «нет» без ответного наказания', tag: 'Навыки согласия', body: 'Отказ может вызвать разочарование, стыд, злость или страх отвержения. Чувства допустимы; давление, наказание, демонстративная обида ради смены ответа, повторные уговоры и лишение тепла как рычаг — нет. Уважительный ответ прост: «Хорошо. Спасибо, что сказал(а)». Если нужно, возьми паузу и самостоятельно восстанови равновесие.' } },
        { id: 'm22', en: { title: 'Regulating a Strong Negative Reaction', tag: 'Regulation', body: 'Notice the sequence: trigger → interpretation → body activation → urge → action. Name the feeling and the story your mind is adding. Pause the conversation if you are too activated to listen. Slow your exhale, orient to the room, unclench your hands, and choose one non-coercive next step. Regulation does not mean suppressing anger; it means taking responsibility for what you do with it.' }, ru: { title: 'Регуляция сильной негативной реакции', tag: 'Регуляция', body: 'Заметь последовательность: триггер → интерпретация → телесное возбуждение → импульс → действие. Назови чувство и историю, которую добавляет ум. Возьми паузу, если уже не можешь слушать. Замедли выдох, оглядись, разожми руки и выбери следующий шаг без давления. Регуляция не означает подавлять злость; она означает отвечать за свои действия.' } },
        { id: 'm23', en: { title: 'Responding to an Accusation Without Deflecting', tag: 'Repair', body: 'Do not rush to counter-accuse, debate the other person out of their feelings, or demand perfect wording before listening. Ask for the specific moment they mean. Reflect the impact you heard. If the description feels inaccurate, say so without erasing their experience: “I remember that differently, but I want to understand what landed badly.” If the exchange becomes insulting or unsafe, pause and return only when both can speak respectfully.' }, ru: { title: 'Отвечать на обвинение без ухода от сути', tag: 'Восстановление', body: 'Не спеши обвинять в ответ, переубеждать человека в его чувствах или требовать идеальных формулировок прежде, чем услышишь. Уточни конкретный эпизод. Отрази, какое воздействие ты понял(а). Если описание кажется неточным, скажи об этом, не стирая чужой опыт: «Я помню это иначе, но хочу понять, что именно тебя задело». Если разговор становится оскорбительным или небезопасным, возьми паузу.' } },
        { id: 'm24', en: { title: 'Core Beliefs and Protective Strategies', tag: 'Self-Understanding', body: 'A belief such as “I must keep everyone happy” may have developed as a way to reduce conflict or stay connected. Treat origins as hypotheses, not diagnoses. Ask: When does this belief appear? What danger does it predict? What does it protect me from? What does it cost now? What more flexible belief could I practise—for example, “I can care about someone’s feelings without controlling them or abandoning my own needs”?' }, ru: { title: 'Базовые убеждения и защитные стратегии', tag: 'Самопонимание', body: 'Убеждение вроде «я должен(на) всех успокаивать» могло сформироваться как способ уменьшить конфликт или сохранить связь. Рассматривай происхождение как гипотезу, а не диагноз. Спроси себя: когда оно включается? Какую опасность предсказывает? От чего защищает? Во что обходится сейчас? Какое более гибкое убеждение можно тренировать — например: «Я могу учитывать чувства другого, не контролируя его и не отказываясь от собственных потребностей».' } },
        { id: 'm25', en: { title: 'Trauma Responses Are Not Character Defects', tag: 'Trauma Education', body: 'Appeasing, freezing, hypervigilance, avoidance, dissociation, and difficulty trusting can be adaptations to repeated threat. They are not proof of weakness or consent. Not everyone exposed to abuse develops PTSD or complex PTSD, and this simulator cannot diagnose either. If material feels overwhelming, stop, orient to the present, and seek qualified support rather than forcing disclosure or deep processing.' }, ru: { title: 'Травматические реакции — не дефекты характера', tag: 'Психообразование о травме', body: 'Уступчивость, замирание, постоянная настороженность, избегание, диссоциация и трудности с доверием могут быть адаптациями к повторяющейся угрозе. Это не слабость и не согласие. Не у каждого человека после насилия развивается ПТСР или комплексное ПТСР; этот симулятор не ставит диагнозы. Если материал перегружает, остановись, верни внимание к настоящему и обратись за квалифицированной поддержкой.' } },
        { id: 'm26', en: { title: 'Accountability Is Behaviour Over Time', tag: 'Accountability', body: 'A meaningful apology names the behaviour, acknowledges its impact, avoids excuses, accepts consequences, and is followed by sustained change. “I was triggered” may explain a reaction; it does not excuse intimidation, coercion, surveillance, or boundary violations. Trust is not owed on demand and cannot be restored by a single conversation. Look for consistent respect when the person is disappointed, told no, or not getting what they want.' }, ru: { title: 'Ответственность — это поведение во времени', tag: 'Ответственность', body: 'Содержательное извинение называет поступок, признаёт его последствия, не оправдывается, принимает последствия и сопровождается устойчивыми изменениями. «Меня триггернуло» может объяснить реакцию, но не оправдывает запугивание, давление, слежку или нарушение границ. Доверие нельзя потребовать и невозможно вернуть одним разговором. Важны последовательные действия, особенно когда человек разочарован или слышит отказ.' } },
        { id: 'm27', en: { title: 'Rebuilding Life After Separation', tag: 'Recovery', body: 'Recovery is not a straight line and separation is not always immediately possible or safe. Practical rebuilding may include private support, documents, money, housing, work, health care, friendships, legal advice, and a safety plan tailored to the situation. Grief, relief, doubt, loneliness, and returning to a relationship can coexist. Progress is measured by increasing choice and safety, not by how quickly someone leaves or “gets over it”.' }, ru: { title: 'Восстановление жизни после расставания', tag: 'Восстановление', body: 'Восстановление не идёт по прямой, а расставание не всегда возможно или безопасно сразу. Практические шаги могут включать конфиденциальную поддержку, документы, деньги, жильё, работу, медицинскую помощь, друзей, юридическую консультацию и индивидуальный план безопасности. Горе, облегчение, сомнения, одиночество и возвращение в отношения могут сосуществовать. Прогресс — это рост выбора и безопасности, а не скорость ухода.' } },
        { id: 'm28', en: { title: 'Substance Use, Honesty and Shared Safety', tag: 'Substance Use', body: 'A person who is using substances is responsible for seeking appropriate help and for the impact of their behaviour. A partner is not responsible for monitoring, diagnosing, or curing them. Honest disclosure, professional assessment, and concrete safety agreements matter more than promises. Boundaries can address intoxication in shared spaces, driving, money, sleep, visitors, and access to the home. Joint support is not appropriate where intimidation or coercive control makes speaking freely unsafe.' }, ru: { title: 'Употребление веществ, честность и общая безопасность', tag: 'Употребление веществ', body: 'Человек, употребляющий вещества, отвечает за обращение за подходящей помощью и за последствия своего поведения. Партнёр не обязан следить, ставить диагноз или лечить его. Важнее обещаний — честность, профессиональная оценка и конкретные договорённости о безопасности. Границы могут касаться опьянения дома, вождения, денег, сна, гостей и доступа в жильё. Совместная помощь не подходит, если запугивание или контроль мешают говорить свободно и безопасно.' } }        ,{ id: 'm29', en: { title: 'Ordinary Conflict Is Not Automatically Abuse', tag: 'Healthy Relationships', body: 'People in safe relationships can disagree, feel irritated, speak sharply, need space, set limits, and sometimes get things wrong. The key questions are what happens next and what pattern exists over time: Can both people disagree? Is there intimidation, humiliation, retaliation, surveillance or fear? Are boundaries respected? Can each person take responsibility and repair? Do not classify a relationship from one isolated argument; examine repetition, power, impact and freedom.' }, ru: { title: 'Обычный конфликт — не обязательно насилие', tag: 'Здоровые отношения', body: 'В безопасных отношениях люди могут не соглашаться, раздражаться, говорить резко, нуждаться в паузе, устанавливать ограничения и ошибаться. Важно, что происходит дальше и какая модель поведения складывается со временем: могут ли оба не соглашаться? Есть ли запугивание, унижение, ответное наказание, слежка или страх? Уважаются ли границы? Способен ли каждый признать свою часть и восстановить контакт? Не оценивайте отношения по одной ссоре — смотрите на повторяемость, власть, последствия и свободу выбора.' } },
        { id: 'm30', en: { title: 'Children Are Not Responsible for Adult Conflict', tag: 'Child Safety', body: 'Children should not be asked to choose sides, carry messages, spy, calm a parent, keep dangerous secrets, or repair an adult relationship. They need age-appropriate voice, privacy, school, friendships, play and access to safe adults. A proportionate, explained, time-limited consequence is different from threats, humiliation, physical harm, deprivation or isolating a child from safe support. If a child may be unsafe, prioritize safeguarding and qualified local help; do not ask the child to confront the adult.' }, ru: { title: 'Дети не отвечают за конфликты взрослых', tag: 'Безопасность детей', body: 'Нельзя просить ребёнка выбирать сторону, передавать сообщения, следить, успокаивать родителя, хранить опасные тайны или восстанавливать отношения взрослых. Ребёнку нужны голос с учётом возраста, личное пространство, школа, друзья, игры и доступ к безопасным взрослым. Разумное, объяснённое и ограниченное по времени последствие отличается от угроз, унижения, физического вреда, лишения необходимого или изоляции от безопасной поддержки. Если ребёнок может быть в опасности, приоритет — защита и помощь местных специалистов; не просите ребёнка противостоять взрослому.' } }
      ];

        return {
          startSceneId: p + '_stage1',
          scenes: (function () {
            var sc = {};
            sc[p + '_stage1'] = {
              stageEn: 'Stage 1 of 4 · Early Charm & Small Test',

                : 'Вы на тихом балконе с Данилом. Он тепло подхватывает каждую фразу, а затем подаётся ближе и говорит: если ты правда доверяешь ему сегодня, то отменишь утренние дела.',

                : 'Your shoulders lift toward your ears as his request turns warmth into a loyalty test.',

                : 'Плечи тянутся к ушам, когда просьба превращается в проверку на доверие.',
              choices: [
                {
                  id: p + '_c1_exit1',
                  labelEn: isA
                    ? 'Exit early: "I like spending time with you, and I\'m heading home now so I keep my morning intact."'
                    : 'Exit early: "I like our talk, and I\'m going to head out now while it still feels easy."',

                    ? 'Выйти рано: «Мне приятно с тобой, и я еду домой сейчас, чтобы сохранить своё утро».'
                    : 'Выйти рано: «Мне нравится наш разговор, и я ухожу сейчас, пока всё легко».',
                  subEn: 'Safe Exit #1 · Leaves before escalation deepens',
                  subRu: 'Безопасный выход №1 · Уход до усиления давления',
                  dynamicId: 'clean_boundary',

                  deltas: { closeness: 1, intimacy: 3, coercion: -8, ownership: -8, karma: 6 },

                  nextSceneId: p + '_end_exit1'
                },
                {
                  id: p + '_c1_stay',
                  labelEn: isA
                    ? 'Stay and negotiate a clear limit: stay one more hour, keep phone on vibrate.'
                    : 'Stay and set a clear limit: stay for one tea, keep your own schedule.',
                  labelRu: isA
                    ? 'Остаться с ясным пределом: ещё на час, звук — вибрация.'
                    : 'Остаться с ясным пределом: ещё на чай, утренний план остаётся.',
                  subEn: 'Advances to Stage 2 · Tests how limits are met',
                  subRu: 'Переход на Этап 2 · Проверка реакции на предел',
                  dynamicId: 'clean_boundary',
                  unlockId: 'm04',
                  deltas: { closeness: 4, intimacy: 3, coercion: 3, ownership: 3, karma: 2 },

                },
                {
                  id: p + '_c1_push',
                  labelEn: isA
                    ? 'Push for full compliance: tell her real connection means putting her first tonight.'
                    : 'Yield to the test: silence the phone and agree to push morning plans aside.',
                  labelRu: isA
                    ? 'Нажать на уступку: сказать, что настоящая связь — ставить её первой сегодня.'
                    : 'Уступить проверке: выключить звук и отодвинуть утренние планы.',
                  subEn: 'Advances to Stage 2 · Escalates pressure',
                  subRu: 'Переход на Этап 2 · Рост давления',
                  dynamicId: isA ? 'possessive_claim' : 'soft_pressure',

                  nextSceneId: p + '_stage2'

              ]
            };

            sc[p + '_stage2'] = {
              stageEn: 'Stage 2 of 4 · Moving Goalposts',
              stageRu: 'Этап 2 из 4 · Сдвиг условий',
              titleEn: isA

                : 'Maya — The Goalpost Shifts When You Hold Your Line',
              titleRu: isA
                ? 'Данил — Условия меняются у двери'
                : 'Майя — Условия меняются, когда ты держишь линию',
              bodyEn: isA
                ? 'Maya smiles thinly when you check the clock: "Funny how quickly your enthusiasm runs out. If you care, stay until dawn and show me your messages so I know there\'s nobody else."'
                : 'Daniel sighs as if wounded: "I thought we had something real. If you walk out now or keep your boundary locked, it proves you were just holding back."',
              bodyRu: isA
                ? 'Майя криво усмехается, глядя на часы: «Забавно, как быстро гаснет твой пыл. Если дорожишь мной — останься до рассвета и покажи переписки, чтобы я не сомневалась».'
                : 'Данил вздыхает так, будто ранен: «А я думал, между нами по-настоящему. Если уйдёшь сейчас или закроешься — значит, просто бережёшь запасной вариант».',
              somaticEn: isA
                ? 'Your jaw locks and your pulse ticks faster as a simple hour turns into a demand for access.'
                : 'Your stomach drops—you feel pulled between keeping your word and proving you are not "cold".',
              somaticRu: isA
                ? 'Челюсть сжимается, пульс чащается: обычный час превращается в требование доступа.'

          scene('s3_joint','Stage 3 · Support by consent','Этап 3 · Поддержка по согласию','Leo — A shared conversation, if safe and wanted','Лео — Совместный разговор, если он безопасен и нужен',

        } else {
          scene('s1','Stage 1 · A pattern becomes visible','Этап 1 · Становится заметен модель поведения','Maya — Loving the creativity, living with the unpredictability','Майя — Любить творчество, жить с непредсказуемостью',
            'You like Leo’s imagination and the comfortable life you share in the villa. But he starts projects and abandons them, jumps between topics, talks unusually fast, and sometimes stays awake with friends until morning. You suspect something is being hidden, but you do not know exactly what. You want an honest conversation, not a detective role.',

            'Your stomach tightens when another explanation does not fit the facts.','Живот сжимается, когда очередное объяснение не совпадает с фактами.',[
              choice('observe','Name the specific behaviours and their impact, then ask for an honest conversation.','Назвать конкретные поступки и их влияние, затем попросить честного разговора.',p+'_s2_talk','curious_check_in',{closeness:3,intimacy:4,coercion:-4,ownership:-4,karma:6}),
              choice('investigate','Start monitoring messages, visitors and spending to find proof.','Начать проверять сообщения, гостей и расходы в поисках доказательств.',p+'_s2_chase','possessive_claim',{closeness:-5,intimacy:-5,coercion:5,ownership:7,karma:-5}),
              choice('space','Step back, speak privately with someone you trust and consider what you need to feel safe at home.','Взять дистанцию, конфиденциально поговорить с близким человеком и определить, что нужно для безопасности дома.',p+'_e_space','clean_boundary',{closeness:1,intimacy:2,coercion:-5,ownership:-5,karma:6})

            'You tell Leo: “I like your energy and creativity. I am worried about the all-night sessions, the noise, the missed plans and the way your explanations keep changing. Is there substance use involved?” You do not need to diagnose him. You need enough truthful information to make decisions about your home and relationship.',
            'Ты говоришь Лео: «Мне нравится твоя энергия и творчество. Меня тревожат ночные встречи, шум, сорванные планы и то, что объяснения постоянно меняются. Здесь есть употребление веществ?» Тебе не нужно ставить диагноз. Тебе нужна честная информация, чтобы принимать решения о доме и отношениях.',

  /* Convert the 5 youth/parent boundary scenarios into the unified STORYLINES schema
     so all 13 storylines share the exact same rich telemetry, somatic cues, pattern recognition,
     editorial review board notes, and hotlines! */
  function convertSimScenarioToUnified(sc) {
    var scenes = {};
    var endings = {};
    var nodes = Array.isArray(sc.nodes) ? sc.nodes : [];

    nodes.forEach(function (n, idx) {
      var isEnd = !n.choices || n.choices.length === 0;
      if (isEnd) {
        var tone = n.ending_type === 'bad' ? 'coercive' : 'safe';
        endings[n.node_id] = {
          tone: tone,
          badgeEn: n.ending_type === 'good' ? 'Safe Grounding' : (n.ending_type === 'bad' ? 'Boundary Erasure / Risk' : 'Mixed Outcome'),
          badgeRu: n.ending_type === 'good' ? 'Опора и защита' : (n.ending_type === 'bad' ? 'Потеря границ / риск' : 'Промежуточный шаг'),
          titleEn: (n.speaker && n.speaker.en) || 'Outcome',
          titleRu: (n.speaker && n.speaker.ru) || 'Итог',
          bodyEn: (n.narrative && n.narrative.en) || '',
          bodyRu: (n.narrative && n.narrative.ru) || '',
          unlockId: n.ending_type === 'good' ? 'm04' : 'm05'
        };
      } else {
        scenes[n.node_id] = {
          stageEn: (n.speaker && n.speaker.en) || ('Step ' + (idx + 1)),
          stageRu: (n.speaker && n.speaker.ru) || ('Шаг ' + (idx + 1)),
          titleEn: (n.speaker && n.speaker.en) || (sc.title && sc.title.en) || 'Scene',
          titleRu: (n.speaker && n.speaker.ru) || (sc.title && sc.title.ru) || 'Сцена',
          bodyEn: (n.narrative && n.narrative.en) || '',
          bodyRu: (n.narrative && n.narrative.ru) || '',
          somaticEn: (n.somatic_cue && n.somatic_cue.en) || '',
          somaticRu: (n.somatic_cue && n.somatic_cue.ru) || '',
          choices: (n.choices || []).map(function (ch, cIdx) {
            var nextNodeObj = nodes.find(function (x) { return x.node_id === ch.next_node; });
            var leadsToEnding = Boolean(nextNodeObj && (!nextNodeObj.choices || nextNodeObj.choices.length === 0));
            var isBadChoice = nextNodeObj && nextNodeObj.ending_type === 'bad';
            return {
              id: n.node_id + '_c' + cIdx,
              labelEn: (ch.text && ch.text.en) || '',
              labelRu: (ch.text && ch.text.ru) || '',
              subEn: (ch.consent_principle && ch.consent_principle.en) || '',
              subRu: (ch.consent_principle && ch.consent_principle.ru) || '',
              nextSceneId: ch.next_node,
              isEnding: leadsToEnding,
              dynamicType: isBadChoice ? 'soft_pressure' : 'clean_boundary',
              deltas: isBadChoice
                ? { closeness: -4, intimacy: -5, coercion: 8, ownership: -9, karma: -4 }
                : { closeness: 4, intimacy: 5, coercion: -6, ownership: 9, karma: 6 }
            };
          })
        };
      }
    });

    var startId = scenes.start ? 'start' : (nodes[0] ? nodes[0].node_id : 'start');
    var audEn = sc.target_audience === 'parent' ? 'Parent Guide' : 'Youth & Boundaries';
    var audRu = sc.target_audience === 'parent' ? 'Для родителей' : 'Подростки и границы';

    return {
      id: sc.id,
      categoryTag: sc.target_audience === 'parent' ? 'Family / Parent' : 'Youth / Safety',
      boardNotes: sc.board_review_notes || null,
      supportResources: sc.support_resources || [],
      en: {
        shortTitle: (sc.title && sc.title.en) || sc.id,
        title: (sc.title && sc.title.en) || sc.id,

        roleNames: { A: audEn, B: 'Review & Alt Path' }
      },

      },
      roleTrees: {
        A: { startSceneId: startId, scenes: scenes, endings: endings },
        B: { startSceneId: startId, scenes: scenes, endings: endings }
      }
    };
  }
