            if (!Number.isFinite(Number(v))) errors.push(where + t7('non-numeric value for “' + k + '”.', 'нечисловое значение для «' + k + '».'));
            else if (Math.abs(Number(v)) > 25) warnings.push(where + t7('very large change for “' + k + '” (' + v + ').', 'очень большое изменение «' + k + '» (' + v + ').'));
          });
        }
        var dyn = c.dynamicType || c.dynamicId;
        if (typeof dyn === 'string' && patternById(dyn)) c.dynamicType = dyn;
        else { c.dynamicType = 'soft_pressure'; ctx.unknownDyn++; }
      });
    });
    eIds.forEach(function (eid) {
      var en = tree.endings[eid];
      if (!isPlainObj(en)) { errors.push(p + t7('ending “' + shortId(eid) + '” is not an object.', 'концовка «' + shortId(eid) + '» должна быть объектом.')); return; }
      if (!hasText(en, 'titleEn', 'titleRu') && !hasText(en, 'bodyEn', 'bodyRu')) warnings.push(p + t7('ending “' + shortId(eid) + '” has no title or text.', 'у концовки «' + shortId(eid) + '» нет названия и текста.'));
      if (typeof en.tone !== 'string' || IMPORT_TONES.indexOf(en.tone) === -1) { en.tone = 'mixed'; ctx.badTone++; }
    });
    /* Reachability */
    if (HAS.call(tree.scenes, tree.startSceneId) && !errors.length) {
      var reach = {}, stack = [tree.startSceneId];
      while (stack.length) {
        var n = stack.pop();
        if (HAS.call(reach, n)) continue;
        reach[n] = 1;
        if (HAS.call(tree.scenes, n) && Array.isArray(tree.scenes[n].choices)) tree.scenes[n].choices.forEach(function (c) { stack.push(c.nextSceneId); });
      }
      var lost = sIds.concat(eIds).filter(function (k) { return !HAS.call(reach, k); });
      if (lost.length) warnings.push(p + t7(lost.length + ' scene(s)/ending(s) can never be reached (e.g. “' + shortId(lost[0]) + '”).', lost.length + ' сцен/концовок недостижимы (например, «' + shortId(lost[0]) + '»).'));
      if (!eIds.some(function (k) { return HAS.call(reach, k); })) warnings.push(p + t7('no ending can be reached.', 'ни одна концовка недостижима.'));
    }
    ctx.counts[role] = { scenes: sIds.length, endings: eIds.length };
  }

  function checkStory(raw) {
    var errors = [], warnings = [];
    var story;
    try { story = JSON.parse(JSON.stringify(raw)); } catch (e) { story = null; }
    if (!isPlainObj(story)) return { errors: [t7('Storyline cannot be read as data.', 'Сюжет не удаётся прочитать как данные.')], warnings: [], story: null, counts: {} };
    var id = story.id;
    if (typeof id !== 'string' || !STORY_ID_RE.test(id) || RESERVED_IDS.indexOf(id.toLowerCase()) !== -1) {
      errors.push(t7('Story ID must be 2–64 letters, numbers, “_” or “-” (and not a reserved word).', 'ID сюжета: 2–64 буквы, цифры, «_» или «-» (и не зарезервированное слово).'));
    }
    var hasEn = isPlainObj(story.en), hasRu = isPlainObj(story.ru);
    if (!hasEn && !hasRu) errors.push(t7('Missing “en” or “ru” block with the title.', 'Нет блока «en» или «ru» с названием.'));
    else {
      if (!hasEn) { story.en = JSON.parse(JSON.stringify(story.ru)); warnings.push(t7('English text missing — Russian will be shown instead.', 'Нет английского текста — вместо него будет показан русский.')); }
      if (!hasRu) { story.ru = JSON.parse(JSON.stringify(story.en)); warnings.push(t7('Russian text missing — English will be shown instead.', 'Нет русского текста — вместо него будет показан английский.')); }
      var titleMissing = false;
      ['en', 'ru'].forEach(function (l) {
        var b = story[l];
        if (typeof b.title !== 'string' || !b.title.trim()) { b.title = (typeof b.shortTitle === 'string' && b.shortTitle) ? b.shortTitle : String(story.id || 'Story'); titleMissing = true; }
        if (typeof b.shortTitle !== 'string' || !b.shortTitle) b.shortTitle = b.title;
        if (typeof b.subtitle !== 'string') b.subtitle = '';
        if (!isPlainObj(b.roleNames)) b.roleNames = {};
        ['A', 'B'].forEach(function (r) {
          if (typeof b.roleNames[r] !== 'string' || !b.roleNames[r]) b.roleNames[r] = (l === 'ru' ? 'Роль ' : 'Role ') + r;
        });
      });
      if (titleMissing) warnings.push(t7('Title missing — the story ID is used instead.', 'Нет названия — вместо него используется ID сюжета.'));
    }
    if (story.categoryTag !== undefined && typeof story.categoryTag !== 'string') delete story.categoryTag;
    var ctx = { unknownDyn: 0, badTone: 0, counts: {} };
    if (!isPlainObj(story.roleTrees)) errors.push(t7('Missing “roleTrees”.', 'Нет «roleTrees».'));
    else {
      if (!story.roleTrees.A) errors.push(t7('The role A scene tree is missing.', 'Нет дерева сцен для роли A.'));
      if (!story.roleTrees.B) warnings.push(t7('Role B is missing — role A will be used for both.', 'Нет роли B — для обеих ролей будет использована роль A.'));
      ['A', 'B'].forEach(function (r) { if (story.roleTrees[r]) checkTree(story.roleTrees[r], r, errors, warnings, ctx); });
    }
    if (ctx.unknownDyn) warnings.push(t7(ctx.unknownDyn + ' choice(s) had no recognised dynamic type and were set to “Soft Pressure / Guilt” for the recognition step.', 'У ' + ctx.unknownDyn + ' выбор(ов) не указан известный тип динамики — для шага распознавания выбрано «Мягкое давление / Вина».'));
    if (ctx.badTone) warnings.push(t7(ctx.badTone + ' ending(s) had no valid tone (safe / coercive / reflective / mixed) and were set to “mixed”.', 'У ' + ctx.badTone + ' концовок нет корректного тона (safe / coercive / reflective / mixed) — выбран «mixed».'));
    return { errors: errors, warnings: warnings, story: story, counts: ctx.counts };
  }

  function toRawItems(parsed) {
    if (Array.isArray(parsed)) return parsed;
    if (isPlainObj(parsed)) {
      if (parsed.roleTrees || Array.isArray(parsed.nodes)) return [parsed];
      if (Array.isArray(parsed.stories)) return parsed.stories;
      if (Array.isArray(parsed.storylines)) return parsed.storylines;
      return Object.keys(parsed).map(function (k) {
        var it = parsed[k];
        if (isPlainObj(it) && it.id === undefined) { it = Object.assign({}, it); it.id = k; }
        return it;
      });
    }
    throw new Error(t7('Expected a JSON array or object of storylines.', 'Ожидался JSON-массив или объект с сюжетами.'));
  }

  function analyseImport(parsed) {
    var raw = toRawItems(parsed);
    if (!raw.length) throw new Error(t7('The data contains no storylines.', 'В данных нет ни одного сюжета.'));
    if (raw.length > IMPORT_MAX_STORIES) throw new Error(t7('Too many storylines at once (maximum ' + IMPORT_MAX_STORIES + ').', 'Слишком много сюжетов сразу (максимум ' + IMPORT_MAX_STORIES + ').'));
    var seen = {};
    return raw.map(function (item, idx) {
      var rec = { index: idx, id: '', title: '', status: 'invalid', errors: [], warnings: [], story: null, selected: false, counts: {} };
      var cand = item;
      try {
        if (isPlainObj(item) && !item.roleTrees && Array.isArray(item.nodes)) {
          if (!STORY_ID_RE.test(item.id || '')) throw new Error(t7('Scenario ID is missing or unsafe.', 'ID сценария отсутствует или содержит недопустимые символы.'));
          cand = convertSimScenarioToUnified(item);
        } else if (!isPlainObj(item) || !item.roleTrees) {
          throw new Error(t7('Unsupported storyline format (expected “roleTrees” or “nodes”).', 'Неподдерживаемый формат сюжета (ожидается «roleTrees» или «nodes»).'));
        }
      } catch (e) {
        rec.errors.push(e.message);
        rec.title = (isPlainObj(item) && typeof item.id === 'string') ? item.id : t7('Item ', 'Элемент ') + (idx + 1);
        return rec;
      }
      var res = checkStory(cand);
      rec.errors = res.errors; rec.warnings = res.warnings; rec.story = res.story; rec.counts = res.counts;
      rec.id = (res.story && typeof res.story.id === 'string') ? res.story.id : '';
      var sl = res.story && (res.story[state.lang] || res.story.en || res.story.ru);
      rec.title = (sl && sl.title) || rec.id || (t7('Item ', 'Элемент ') + (idx + 1));
      if (!rec.errors.length) {
        if (HAS.call(BUILTIN_STORYLINES, rec.id) || HAS.call(EXTRA_STORYLINES, rec.id)) {
          rec.status = 'builtin';
          rec.errors.push(t7('Already included in the app, so it is not needed (and cannot be replaced).', 'Этот сюжет уже есть в приложении, поэтому загружать его не нужно (и заменить его нельзя).'));
        } else if (HAS.call(seen, rec.id)) {
          rec.status = 'invalid';
          rec.errors.push(t7('The same ID appears more than once in this file.', 'Этот ID встречается в файле несколько раз.'));
        } else {
          rec.status = HAS.call(personalStorylines, rec.id) ? 'replace' : 'new';
          rec.selected = rec.status === 'new';
        }
        seen[rec.id] = 1;
      }
      return rec;
    });
  }

  function processImportText(raw, sourceName) {
    raw = String(raw || '').replace(/^\uFEFF/, '').trim();
    if (!raw) { importDraft = null; setImportStatus('', ''); renderImportPreview(); return; }
    try {
      var parsed, first = raw.charAt(0);
      if (first === '[' || first === '{') {
        try { parsed = JSON.parse(raw); }
        catch (e) { throw new Error(t7('This is not valid JSON — ', 'Это не корректный JSON — ') + e.message); }
      } else {
        parsed = csvRowsToStorylines(parseCsvRows(raw));
      }
      importDraft = { items: analyseImport(parsed), source: sourceName || '' };
      setImportStatus('', '');
    } catch (e) {
      importDraft = null;
      setImportStatus(t7('Could not read the data. ', 'Не удалось прочитать данные. ') + e.message, 'err');
    }
    renderImportPreview();
  }

    var chosen = importDraft.items.filter(function (it) { return it.selected && it.story && (it.status === 'new' || it.status === 'replace'); });
    if (!chosen.length) return;
    var backup = JSON.stringify(personalStorylines);

    try {

  window.handleImportSheet = async function () {
    var url = document.getElementById('importSheetUrl').value.trim();
    if (!url) return;
    try {
      var parsedUrl = new URL(url);
      if (parsedUrl.protocol !== 'https:' || !/(^|\.)docs\.google\.com$/.test(parsedUrl.hostname) || parsedUrl.pathname.indexOf('/spreadsheets/') === -1) {
        throw new Error(t7('Use a public https://docs.google.com/spreadsheets/... CSV export link.', 'Используйте публичную ссылку https://docs.google.com/spreadsheets/... на экспорт CSV.'));
      }
      setImportStatus(t7('Fetching…', 'Загрузка…'), '');
      var res = await fetch(parsedUrl.href, { credentials: 'omit', redirect: 'follow' });
      var finalHost = new URL(res.url).hostname;
      if (!/(^|\.)google\.com$/.test(finalHost) && !/(^|\.)googleusercontent\.com$/.test(finalHost)) throw new Error(t7('Google Sheets redirected to an unexpected host.', 'Google Sheets перенаправил на неожиданный адрес.'));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var txt = await res.text();
      if (txt.length > IMPORT_MAX_BYTES) throw new Error(t7('Sheet export exceeds 2 MB.', 'Экспорт таблицы больше 2 МБ.'));

      document.getElementById('impFileName').textContent = 'Google Sheet';

          '<div class="lang-switch">' +
            '<button class="' + (isRu ? 'active-lang' : '') + '" onclick="setLang(\'ru\')">RU</button>' +
            '<button class="' + (!isRu ? 'active-lang' : '') + '" onclick="setLang(\'en\')">EN</button>' +
          '</div>' +
          '<button onclick="openImport()">' + (isRu ? 'Импорт / Экспорт' : 'Import / Export') + '</button>' +
          '<button class="danger" onclick="triggerQuickExit()">' + (isRu ? 'Быстрый выход' : 'Quick Exit') + '</button>' +
        '</div>' +
      '</div>';

    /* 2. 5-Axis Live Telemetry & Inline Inspector */
    var activeStatMeta = STAT_META[state.inspectorStat] || STAT_META.ownership;
    var activeStatLoc = activeStatMeta[lang] || activeStatMeta.en;

    var statCardsHtml = STAT_KEYS.map(function (k) {
      var m = STAT_META[k];
      var mLoc = m[lang] || m.en;
      var rawVal = state.stats[k];
      var rawDelta = state.lastDeltas[k] || 0;
      var bounds = STAT_BOUNDS[k] || [0, 100];
      var val = k === 'ownership' ? 100 - rawVal : rawVal;
      var d = k === 'ownership' ? -rawDelta : rawDelta;
      var displayVal = k === 'karma' ? (val > 0 ? '+' : '') + val : val;
      var barWidth = ((val - bounds[0]) / (bounds[1] - bounds[0])) * 100;
      var deltaStr = d > 0 ? '<span class="delta-pos">+' + d + '</span>' : (d < 0 ? '<span class="delta-neg">' + d + '</span>' : '');
      return (
        '<button class="stat-tile ' + (state.inspectorStat === k ? 'selected' : '') + '" onclick="selectStatInspector(\'' + k + '\')">' +
          '<div class="stat-top">' +
            '<span style="color:' + m.color + '">' + escapeHtml(mLoc.name) + '</span>' +
            '<span>' + deltaStr + '</span>' +
          '</div>' +
          '<div class="stat-val">' + displayVal + '<span class="muted">/' + (k === 'karma' ? '50' : '100') + '</span></div>' +
          '<div class="stat-bar"><div class="stat-bar-fill" style="width:' + barWidth + '%;background:' + m.color + '"></div></div>' +
        '</button>'
      );
    }).join('');

    var telemetryHtml =
      '<div class="telemetry-card">' +
        '<div class="stats-grid">' + statCardsHtml + '</div>' +
        '<div class="inspector-inline">' +
          '<strong style="color:' + activeStatMeta.color + '">' + escapeHtml(activeStatLoc.name) + ':</strong> ' +
          escapeHtml(activeStatLoc.summary) +
          (activeStatLoc.principle ? ' <span class="muted">(' + escapeHtml(activeStatLoc.principle) + ')</span>' : '') +
        '</div>' +
      '</div>';

    /* 3. Left Column: Interactive Storyline Simulator */
    var storyRibbonHtml = storyIds.map(function (sid) {
      var st = ALL_STORYLINES[sid];
      var loc = st[lang] || st.en;
      return '<button class="story-chip ' + (sid === state.storyId ? 'active' : '') + '" onclick="selectStoryHandler(\'' + sid + '\')">' +
        escapeHtml(loc.shortTitle) + '</button>';
    }).join('');

    var bodyContentHtml = '';
    if (ending) {
      var isSafe = ending.tone !== 'coercive';
      var endTitle = isRu ? (ending.titleRu || ending.titleEn) : (ending.titleEn || ending.titleRu);
      var endBody = isRu ? (ending.bodyRu || ending.bodyEn) : (ending.bodyEn || ending.bodyRu);
      var endBadge = isRu ? (ending.badgeRu || ending.badgeEn) : (ending.badgeEn || ending.badgeRu);
      var idx = storyIds.indexOf(state.storyId);
      var nextStoryId = storyIds[(idx + 1) % storyIds.length];

      bodyContentHtml =
        '<div class="scene-box" style="border-color:' + (isSafe ? 'rgba(74,222,128,0.45)' : 'rgba(248,113,113,0.45)') + '">' +
          '<div class="badge-row"><span class="badge ' + (isSafe ? 'safe' : 'coercive') + '">' + escapeHtml(endBadge) + '</span></div>' +
          '<h3 style="margin:4px 0 8px;">' + escapeHtml(endTitle) + '</h3>' +
          '<p style="margin:0;">' + escapeHtml(endBody) + '</p>' +
        '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">' +
          '<button class="primary" onclick="selectStoryHandler(\'' + state.storyId + '\')">' + (isRu ? 'Пройти ветку заново' : 'Replay Branch') + '</button>' +
          '<button onclick="selectStoryHandler(\'' + nextStoryId + '\')">' + (isRu ? 'Следующая история →' : 'Next Storyline →') + '</button>' +
        '</div>';
    } else if (scene) {
      var scStage = isRu ? (scene.stageRu || scene.stageEn) : (scene.stageEn || scene.stageRu);
      var scTitle = isRu ? (scene.titleRu || scene.titleEn) : (scene.titleEn || scene.titleRu);
      var scBody = isRu ? (scene.bodyRu || scene.bodyEn) : (scene.bodyEn || scene.bodyRu);
      var scSom = isRu ? (scene.somaticRu || scene.somaticEn) : (scene.somaticEn || scene.somaticRu);

      var choicesHtml = (scene.choices || []).map(function (c) {
        var cLbl = isRu ? (c.labelRu || c.labelEn) : (c.labelEn || c.labelRu);
        var cSub = isRu ? (c.subRu || c.subEn) : (c.subEn || c.subRu);
        return (
          '<button class="choice-btn" onclick="pickChoiceHandler(\'' + c.id + '\')" ' + (state.pendingChoice ? 'disabled' : '') + '>' +
            '<span>' + escapeHtml(cLbl) + '</span>' +
            (cSub ? '<span class="choice-sub">' + escapeHtml(cSub) + '</span>' : '') +
          '</button>'
        );
      }).join('');

      var postChoiceHtml = '';
      if (state.pendingChoice) {
        var targetDyn = state.pendingChoice.dynamicType || state.pendingChoice.dynamicId || 'clean_boundary';
        var dynChips = INTERACTION_TYPES.map(function (it) {
          var tLoc = it[lang] || it.en;
          var cls = 'dyn-chip';
          if (state.guessedType) {
            if (it.id === targetDyn) cls += ' correct';
            else if (it.id === state.guessedType) cls += ' wrong';
          }
          return '<button class="' + cls + '" onclick="guessDynamicHandler(\'' + it.id + '\')">' + escapeHtml(tLoc.name) + '</button>';
        }).join('');

        var matchedObj = INTERACTION_TYPES.find(function (it) { return it.id === targetDyn; });
        var matchedLoc = matchedObj ? (matchedObj[lang] || matchedObj.en) : null;

        postChoiceHtml =
          '<div class="post-choice-box">' +
            '<div style="font-weight:700;font-size:0.86rem;color:var(--accent);">' +
              (isRu ? 'Распознайте динамику этого шага (+10 очков за точность):' : 'Identify the interaction dynamic of this move (+10 pts):') +
            '</div>' +
            '<div class="chip-row">' + dynChips + '</div>' +
            (state.guessedType && matchedLoc
              ? '<div style="font-size:0.83rem;margin:6px 0;"><strong>' + escapeHtml(matchedLoc.name) + ':</strong> ' + escapeHtml(matchedLoc.hint || matchedLoc.summary || '') + ' <button type="button" class="dyn-chip" onclick="openPattern(\'' + escapeHtml(targetDyn) + '\')">' + (isRu ? 'Подробнее →' : 'Learn more →') + '</button></div>'
              : '') +
            '<button class="primary" style="margin-top:6px;" onclick="advanceChoiceHandler()">' +
              (isRu ? 'Продолжить по ветке →' : 'Continue Branch →') +
            '</button>' +
          '</div>';
      }

      bodyContentHtml =
        '<div class="scene-box">' +
          '<div class="badge-row"><span class="badge accent">' + escapeHtml(scStage) + '</span></div>' +
          '<h3 style="margin:2px 0 8px;">' + escapeHtml(scTitle) + '</h3>' +
          '<p style="margin:0;font-size:0.96rem;">' + escapeHtml(scBody) + '</p>' +
        '</div>' +
        (scSom ? '<div class="somatic-box"><span class="somatic-label">' + (isRu ? 'Реакция тела' : 'Somatic Cue / Body Signal') + '</span>' + escapeHtml(scSom) + '</div>' : '') +
        '<div class="choice-list">' + choicesHtml + '</div>' +
        postChoiceHtml;
    }

    var boardNotesHtml = '';
    if (story.boardNotes) {
      var bn = story.boardNotes;
      var pickBn = function (obj) { return obj ? (obj[lang] || obj.ru || obj.en || '') : ''; };
      boardNotesHtml =
        '<details style="margin-top:12px;" open>' +
          '<summary style="cursor:pointer;font-size:0.83rem;font-weight:700;color:var(--accent);">' +
            (isRu ? 'Комментарии экспертного совета (литература, травма, груминг, соматика)' : 'Expert Review Board Notes (Literature, Trauma, Grooming, Somatics)') +
          '</summary>' +
          '<div class="board-grid">' +
            '<div class="board-cell"><strong>' + (isRu ? 'Литературный редактор' : 'Literary Editor') + '</strong>' + escapeHtml(pickBn(bn.lit_editor)) + '</div>' +
            '<div class="board-cell"><strong>' + (isRu ? 'Травма и границы' : 'Trauma & Interviewing') + '</strong>' + escapeHtml(pickBn(bn.forensic_trauma)) + '</div>' +
            '<div class="board-cell"><strong>' + (isRu ? 'Динамика груминга' : 'Grooming Dynamics') + '</strong>' + escapeHtml(pickBn(bn.grooming_dynamics)) + '</div>' +
            '<div class="board-cell"><strong>' + (isRu ? 'Соматика и защита' : 'Somatics & Protection') + '</strong>' + escapeHtml(pickBn(bn.somatic_advocate)) + '</div>' +
          '</div>' +
        '</details>';
    }

    var resourcesHtml = '';
    if (story.supportResources && story.supportResources.length > 0) {
      resourcesHtml =
        '<div class="resources-box">' +
          '<strong>' + (isRu ? 'Линии поддержки и защиты:' : 'Support & Safety Contacts:') + '</strong>' +
          '<ul style="margin:6px 0 0 18px;padding:0;">' +
            story.supportResources.map(function (r) {
              var rName = r.name ? (r.name[lang] || r.name.ru || r.name.en) : '';
              return '<li><strong>' + escapeHtml(rName) + ':</strong> ' + escapeHtml(r.contact) + '</li>';
            }).join('') +
          '</ul>' +
        '</div>';
    }

    var simulatorColHtml =
      '<div class="card">' +
        '<div class="story-ribbon">' + storyRibbonHtml + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">' +
          '<div style="display:flex;gap:6px;">' +
            '<button class="' + (state.role === 'A' ? 'active-pill' : '') + '" onclick="setRoleHandler(\'A\')">A · ' + escapeHtml(sLoc.roleNames.A) + '</button>' +
            '<button class="' + (state.role === 'B' ? 'active-pill' : '') + '" onclick="setRoleHandler(\'B\')">B · ' + escapeHtml(sLoc.roleNames.B) + '</button>' +
          '</div>' +
          '<div style="display:flex;gap:6px;">' +
            '<button onclick="stepBackHandler()" ' + (state.history.length === 0 && !state.pendingChoice ? 'disabled' : '') + '>' + (isRu ? '← Шаг назад' : '← Step Back') + '</button>' +
            '<button onclick="selectStoryHandler(\'' + state.storyId + '\')">' + (isRu ? 'Сначала' : 'Restart') + '</button>' +
          '</div>' +
        '</div>' +
        '<h2 style="margin:4px 0 4px;font-size:1.15rem;">' + escapeHtml(sLoc.title) + '</h2>' +
        '<p class="muted" style="margin-top:0;">' + escapeHtml(sLoc.subtitle) + '</p>' +
        bodyContentHtml +
        boardNotesHtml +
        resourcesHtml +
      '</div>';

    /* 4. Right Column: Persistent Knowledge & Theory Deck */
    var tabButtonsHtml =
      '<div class="deck-tabs">' +
        '<button class="deck-tab ' + (state.activeDeckTab === 'theory' ? 'active' : '') + '" onclick="setDeckTab(\'theory\')">' +
          (isRu ? 'Теория (' + ARCHIVE_MODULES.length + ')' : 'Theory (' + ARCHIVE_MODULES.length + ')') +
        '</button>' +
        '<button class="deck-tab ' + (state.activeDeckTab === 'dynamics' ? 'active' : '') + '" onclick="setDeckTab(\'dynamics\')">' +
          (isRu ? 'Паттерны (' + INTERACTION_TYPES.length + ')' : 'Dynamics (' + INTERACTION_TYPES.length + ')') +
        '</button>' +
        '<button class="deck-tab ' + (state.activeDeckTab === 'directory' ? 'active' : '') + '" onclick="setDeckTab(\'directory\')">' +
          (isRu ? 'Все сюжеты (' + storyIds.length + ')' : 'All Stories (' + storyIds.length + ')') +
        '</button>' +
        '<button class="deck-tab ' + (state.activeDeckTab === 'ledger' ? 'active' : '') + '" onclick="setDeckTab(\'ledger\')">' +
          (isRu ? 'Итоги (' + state.endingsReached.length + ')' : 'Ledger (' + state.endingsReached.length + ')') +
        '</button>' +
      '</div>';

    var deckBodyHtml = '';
    if (state.activeDeckTab === 'theory') {
      var tags = ['ALL'];
      ARCHIVE_MODULES.forEach(function (m) {
        var tg = (m[lang] || m.en).tag;
        if (tags.indexOf(tg) === -1) tags.push(tg);
      });

      var q = state.theorySearch.toLowerCase().trim();
      var filteredMods = ARCHIVE_MODULES.filter(function (m) {
        var loc = m[lang] || m.en;
        if (state.theoryTagFilter !== 'ALL' && loc.tag !== state.theoryTagFilter) return false;
        if (!q) return true;
        return loc.title.toLowerCase().indexOf(q) !== -1 || loc.body.toLowerCase().indexOf(q) !== -1 || loc.tag.toLowerCase().indexOf(q) !== -1;
      });

      deckBodyHtml =
        '<input type="search" id="theorySearchInput" autocomplete="off" value="' + escapeHtml(state.theorySearch) + '" oninput="setTheorySearch(this.value)" placeholder="' + (isRu ? 'Поиск по модулям теории...' : 'Search theory modules...') + '" />' +
        '<div class="chip-row">' +
          tags.map(function (tg) {
            return '<button class="dyn-chip ' + (state.theoryTagFilter === tg ? 'active-pill' : '') + '" onclick="setTheoryTag(\'' + escapeHtml(tg) + '\')">' +
              escapeHtml(tg === 'ALL' ? (isRu ? 'Все темы' : 'All Topics') : tg) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="theory-list" id="theoryList">' +
          filteredMods.map(function (m) {
            var loc = m[lang] || m.en;
            return (
              '<div class="theory-card unlocked">' +
                '<div class="badge-row" style="margin-bottom:2px;"><span class="badge accent">' + escapeHtml(m.id.toUpperCase()) + ' · ' + escapeHtml(loc.tag) + '</span></div>' +
                '<h4>' + escapeHtml(loc.title) + '</h4>' +
                '<p>' + escapeHtml(loc.body) + '</p>' +
              '</div>'
            );
          }).join('') +
        '</div>';
    } else if (state.activeDeckTab === 'dynamics') {
      deckBodyHtml = patternPanelHtml();
    } else if (state.activeDeckTab === 'directory') {
      deckBodyHtml = directoryPanelHtml();
    } else {
      deckBodyHtml =
        '<div class="muted" style="margin-bottom:8px;">' +
          (isRu ? 'Бонусные очки за распознавание модель поведенияов: +' : 'Pattern Recognition Bonus Points: +') + state.bonusPoints +
        '</div>' +
        (state.endingsReached.length === 0
          ? '<p class="muted">' + (isRu ? 'Пройдите любую ветку до концовки, чтобы зафиксировать результат в журнале.' : 'Complete any storyline branch to log its ending here.') + '</p>'
          : '<div class="theory-list">' + state.endingsReached.map(function (er) {
              var st = getStory(er.storyId);
              var sName = (st[lang] || st.en).shortTitle;
              var eTitle = isRu ? (er.titleRu || er.titleEn) : (er.titleEn || er.titleRu);
              return (
                '<div class="theory-card">' +
                  '<span class="badge ' + (er.tone === 'coercive' ? 'coercive' : 'safe') + '">' + escapeHtml(er.tone.toUpperCase()) + '</span> ' +
                  '<strong>' + escapeHtml(sName) + ' (' + er.role + ')</strong>' +
                  '<p style="margin-top:4px;">' + escapeHtml(eTitle) + '</p>' +
                '</div>'
              );
            }).join('') + '</div>');
    }

    var deckColHtml =
      '<div class="card" id="deckCard">' +
        tabButtonsHtml +
        deckBodyHtml +
      '</div>';

    root.innerHTML =
      headerHtml +
      telemetryHtml +
      '<div class="main-grid">' +
        simulatorColHtml +
        deckColHtml +
      '</div>';
    localizeImportModal();
  }

  /* Boot immediately & on DOMContentLoaded */
  function safeBoot() {
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      render();
    } catch (err) {
      var r = document.getElementById('appRoot');
      if (r) {
        r.innerHTML = '<div class="card" style="border-color:#f87171;"><strong>Boot Error:</strong> ' + String(err && err.message ? err.message : err) + '</div>';
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', safeBoot);
  } else {
    safeBoot();
  }
})();
</script>
</body>
</html>
